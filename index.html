    <style>
        :root {
            --bg-void: #080808;
            --bg-surface: #0D0D0D;
            --gold-primary: #C5A55A;
            --gold-deep: #8B6914;
            --gold-glow: rgba(197, 165, 90, 0.15);
            --node-w: 180px;
            --node-w-deep: 140px;
        }

        @media (max-width: 768px) {
            :root {
                --node-w: 140px;
                --node-w-deep: 110px;
            }
        }

        body {
            background-color: var(--bg-void);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        .gold-pill {
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-deep) 100%);
            color: black;
        }

        .glass-card {
            background: var(--bg-surface);
            border: 1px solid #1a1a1a;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            border-color: rgba(197, 165, 90, 0.4);
            box-shadow: 0 0 30px var(--gold-glow);
            transform: translateY(-4px);
        }

        .tamga-glow {
            text-shadow: 0 0 15px rgba(197, 165, 90, 0.6);
        }

        @keyframes eqbar { from { height: 4px; } to { height: 16px; } }
        @keyframes float {

            0%,
            100% {
                transform: translateY(0) translateX(0);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-40px) translateX(20px);
                opacity: 0.8;
            }
        }

        @keyframes tokenFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes tokenGlow {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(74, 222, 128, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(74, 222, 128, 0.6)) drop-shadow(0 0 60px rgba(197, 165, 90, 0.3));
            }
        }

        .animate-float {
            animation: float 10s ease-in-out infinite;
        }

        .token-card {
            animation: tokenFloat 3s ease-in-out infinite, tokenGlow 4s ease-in-out infinite;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #080808;
        }

        ::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold-primary);
        }

        /* ── Tree animations ── */
        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 16px rgba(197,165,90,0.18), 0 4px 20px rgba(0,0,0,0.5); }
            50%       { box-shadow: 0 0 36px rgba(197,165,90,0.48), 0 0 60px rgba(197,165,90,0.14), 0 4px 20px rgba(0,0,0,0.5); }
        }
        @keyframes lineGlow {
            0%, 100% { opacity: 0.3; }
            50%       { opacity: 0.9; }
        }
        @keyframes nodeReveal {
            from { opacity: 0; transform: translateY(-14px) scale(0.93); }
            to   { opacity: 1; transform: translateY(0)     scale(1); }
        }
        @keyframes sibIn {
            from { opacity: 0; transform: translateY(-5px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes dotPulse {
            0%, 100% { transform: translate(-50%,-50%) scale(1);   opacity: 0.7; }
            50%       { transform: translate(-50%,-50%) scale(1.6); opacity: 1; }
        }
        .tree-node-main  { animation: pulseGold 3.2s ease-in-out infinite; }
        .tree-line-main  { animation: lineGlow  2.5s ease-in-out infinite; }
        .tree-dot-main   { animation: dotPulse  2s   ease-in-out infinite; }

        /* ── Print / PDF ── */
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body { background: #080808 !important; margin:0; padding:0; }
            #root > div > * { display: none !important; }
            #cert-printable  { display: flex !important; }
            #nft-print-area  { display: flex !important; }
            @page { margin: 0; size: A4 portrait; }
        }
        #cert-printable { display: none; }
        #nft-print-area { display: none; }

        /* NFT card shimmer */
        @keyframes shimmer {
            0%   { background-position: -200% center; }
            100% { background-position:  200% center; }
        }
        .nft-shimmer {
            background: linear-gradient(90deg, transparent 0%, rgba(197,165,90,0.08) 50%, transparent 100%);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes starPulse {
            0%,100% { opacity:.15; transform:scale(1); }
            50%      { opacity:.6;  transform:scale(1.3); }
        }

        /* Profile gradient ring */

            background: conic-gradient(#C5A55A 0%, #8B6914 40%, #C5A55A10 60%, #C5A55A 100%);
            padding: 2px; border-radius: 9999px;

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const ZHUZES = {
            ULY: "Ұлы жүз",
            ORTA: "Орта жүз",
            KISHI: "Кіші жүз",
            AKSUYEK: "Ақсүйек"
        };

        const TRIBES_DB = {
            // Ұлы жүз
            qanly: { name: "ҚАҢЛЫ", juz: ZHUZES.ULY, tamga: "⩚", tamgaName: "Көсеу", color: "#C5A55A", story: "Қаңлы — древнее племя, упоминаемое в источниках задолго до нашей эры. Они были мощной силой в Сырдарьинском регионе. По Темиргалиеву, Канглы являются наследниками могущественной державы Кангюй.", era: "III в. до н.э. — XVIII в." },
            shanyshqyly: { name: "ШАНЫШҚЫЛЫ", juz: ZHUZES.ULY, tamga: "⋔", tamgaName: "Шанышқы", color: "#C5A55A", story: "Шанышқылы — воинственное племя Старшего жуза. Входят в объединение Үйсін (потомки Бәйдібека). Сыграли важную роль в защите южных рубежей Казахского ханства." },
            sirgeli: { name: "СІРГЕЛІ", juz: ZHUZES.ULY, tamga: "⋂", tamgaName: "Сірге", color: "#C5A55A", story: "Сиргели получили название от знака 'сирге' — путы для жеребят. Это племя славилось своими табунами и мастерством в коневодстве." },
            shaqsham: { name: "ШАҚШАМ", juz: ZHUZES.ULY, tamga: "ᗕ", tamgaName: "Тамға", color: "#C5A55A", story: "Малочисленное, но гордое объединение в составе Старшего жуза, сохранившее свою идентичность через века." },
            saryuysin: { name: "САРЫҮЙСІН", juz: ZHUZES.ULY, tamga: "⚭", tamgaName: "Абақ", color: "#C5A55A", story: "Прямые наследники древних Усуней, господствовавших в Семиречье в античную эпоху. 'Сары' указывает на древность или благородство происхождения." },
            shapyrashty: { name: "ШАПЫРАШТЫ", juz: ZHUZES.ULY, tamga: "☾", tamgaName: "Ай", color: "#C5A55A", story: "Шапырашты — стражи Жетысу. Из этого рода вышли многие батыры, защищавшие Алматинский регион от набегов джунгар." },
            jalayir: { name: "ЖАЛАЙЫР", juz: ZHUZES.ULY, tamga: "⫙", tamgaName: "Тарақ", color: "#C5A55A", story: "Жалайыры — одно из самых влиятельных племен в империи Чингисхана. Мукали-гоо-ван, правая рука Чингисхана, был жалайыром. В Казахском ханстве считались 'ноқта ағасы' — первенствующими в Старшем жузе." },

                history: `Ошақты получили имя от «ошақ» — трёх камней очага, главного символа казахской юрты.\n\nЭто указывает на их священную роль хранителей домашнего очага. Братский род Ысты. Из их среды выходили лучшие мастера по войлоку — основному строительному материалу степи.`,
                tamga: `Тамға «Тұмар» (△) — треугольный оберег.\n\nТұмар — амулет, который носили у сердца. Три вершины — небо, земля, человек. Название рода происходит от «ошақ» — очаг, а тамга-оберег хранит этот очаг от беды. Самая домашняя и самая защитная тамга Старшего жуза.`,
                famous: `Атақты адамдар:\n\n★ Устазы Ошақты\nМастера-юртостроители, чьё искусство войлочного производства признавалось лучшим в регионе.`,
                traditions: `Дәстүрлер:\n\n• «Ошақ жағу» — ритуал разжигания первого огня при переезде. Первым огонь разжигает старейшина.\n• Наурыз как праздник нового очага — особо торжественно отмечается.\n• «Кигіз басу» — коллективное изготовление войлока как родовой праздник.`,
                location: `Мекен:\n\nТуркестанская область, берега Сырдарьи и горы Каратау.`

            alban: {
                history: `Албан — горный народ Заилийского Алатау, один из крупнейших родов Старшего жуза. Известны своим непокорным характером и воинской доблестью.\n\nВ 1916 году Албан возглавили восстание против царского указа о трудовой мобилизации. Амангелди Иманов — сын Албана — стал национальным символом борьбы за свободу.`,
                tamga: `Тамға «Көсеу» (⊢) — очажная кочерга.\n\nКөсеу управляет огнём: подкладывает, раздувает, укрощает. Албаны — хранители огня Заилийского Алатау, род Райымбек-батыра. Кто владеет көсеу, тот владеет теплом дома и не даст угаснуть очагу рода.`,
                famous: `Атақты адамдар:\n\n★ Амангелді Иманов (1873–1919)\nБатыр и революционный герой. Руководил восстанием 1916 года против колониального указа о призыве. Национальный герой Казахстана, чьё имя носит город.\n\n★ Батыры Аныракая (1730)\nГерои решающей битвы с джунгарами, где Албан сыграли ключевую роль.`,
                traditions: `Дәстүрлер:\n\n• «Ер мерейі» — воинская честь, не позволяющая отступить без боя.\n• «Жасауыл» — старший мужчина рода выступает военным советником.\n• Кузнечное мастерство — Албан славились изготовлением оружия.`,
                location: `Мекен:\n\nАлматинская область, горы Заилийского Алатау и Кетмень.`

            suan: {
                history: `Суан — братский род Албанов и Дулатов. Кочевали в предгорьях Джунгарского Алатау и долине реки Или.\n\nАктивно участвовали во всех крупных войнах Старшего жуза. Отличались верностью союзническому долгу — никогда не предавали своих братьев.`,
                tamga: `Тамға «Босаға» (⊓) — дверной косяк юрты.\n\nБосаға — порог и рама двери, граница между домом и миром. Тот, кто стоит у босаға, встречает гостя и защищает семью. Суан — братский род Албанов и Дулатов, стоявший на пороге Джунгарского Алатау.`,
                famous: `Атақты адамдар:\n\n★ Батыры Суана (XVIII в.)\nВоины, участники антиджунгарского движения. Прославились верностью и бесстрашием.`,
                traditions: `Дәстүрлер:\n\n• «Ата жолы» — ежегодный поминальный ас с конными состязаниями.\n• «Қонақасы» — обязательное угощение любого путника, зашедшего в юрту.\n• Тесные братские связи с Албан и Дулат — совместные тои и родовые съезды.`,
                location: `Мекен:\n\nАлматинская область, предгорья Джунгарского Алатау.`

            dulat: {
                history: `Дулат — самый многочисленный род Старшего жуза, делящийся на четыре ветви: Ботпай, Шымыр, Сикым, Жаныс. Фактически контролировали Жетысу (Семиречье) на протяжении веков.\n\nИз Дулатов вышли крупные политические деятели и просветители. Шормановтар — знатная семья Дулатов — дали Казахстану первых чиновников-реформаторов эпохи XIX века.`,
                tamga: `Тамға «Дөңгелек» (◯) — полный круг, символ совершенства и единства.\n\nСамая чистая тамга: круг без начала и конца — как сам Дулат, который никогда не прерывался и всегда возвращался к своим корням.`,
                famous: `Атақты адамдар:\n\n★ Шормановтар (XIX в.)\nЗнатная семья Дулатов. Дали Казахстану просветителей и первых чиновников, работавших с российской администрацией.\n\n★ Сейфулла Кожаахметов (XIX в.)\nПросветитель, собиратель казахского фольклора и защитник прав кочевников.`,
                traditions: `Дәстүрлер:\n\n• «Шежіре жадысы» — традиция устного сохранения родословной до 12 поколений.\n• «Наурыз той» с обязательным кокпаром и байгой для всех четырёх ветвей.\n• «Той ағасы» — выбор самого уважаемого мужчины для руководства торжеством.`,
                location: `Мекен:\n\nАлматинская, Жамбылская области. Жетысу, долина Или, Чу. Крупнейший род по численности.`
            },
            argyn: {
                history: `📖 Представь степь XVIII века. Среди всех родов Орта жуза есть один, из которого выходят не батыры с саблями — а мудрецы со словом. Это Арғын.\n\n«Арғы» — значит «тот, что дальше всех уходит в древность». И это правда: Аргыны помнят себя со времён великих тюркских каганатов.\n\nНо главная их сила — не армия. Это слово. Казыбек бий одной речью остановил войну. Абай одним стихом изменил мышление целого народа. Шоқан одним путешествием открыл Азию для всего мира.\n\n🌍 Сегодня Арғын — самый многочисленный казахский род. Их история — это история казахской интеллигенции, казахской дипломатии и казахского духа.`,
                tamga: `Тамға «Көз» (◎) — глаз.\n\nКөзтаңба — «глазная тамга»: круги, как пара глаз, смотрящих в степь. Символ зоркости, мудрости и прозорливости. Аргыны — племя биев и дипломатов, чьи глаза видели дальше других. В старых источниках тамга изображается как «оо».`,
                famous: `Атақты адамдар:\n\n★ Казыбек бий (1667–1763)\nВеликий би, один из Трёх биев (Үш би). Его речь перед калмыками остановила войну. «Казыбек сөзі» — образец казахского красноречия.\n\n★ Абай Кунанбаев (1845–1904)\nПоэт, философ, просветитель. Отец современной казахской литературы. «Қара сөздер» — духовный завет нации.\n\n★ Шоқан Уәлиханов (1835–1865)\nПутешественник, учёный. Первый казах-исследователь мирового уровня. Составил карты Центральной Азии.`,
                traditions: `Дәстүрлер:\n\n• «Шежіре сақтау» — хранение родословной — священный долг каждого аргына.\n• «Жиын» — большой родовой съезд для решения важных вопросов.\n• Традиция акынства и айтысов — поэтические поединки в крови у аргынов.`,
                location: `Мекен:\n\nКарагандинская, Павлодарская, Северо-Казахстанская, Акмолинская области.`

            nayman: {
                history: `Найман — потомки Найманского ханства (XII в.), одного из самых развитых государств домонгольской степи. Найманы имели государственность, письменность (уйгурское письмо) и развитую культуру задолго до Чингисхана.\n\nПосле монгольского завоевания сохранили аристократическое самосознание и традицию письменности — редкое явление среди кочевников.`,
                tamga: `Тамға «Шөміш» (⊔) — ковш.\n\nШөміш черпает кумыс из сабы и разливает гостям — символ щедрости, достатка и хозяйской руки. Найманы, наследники Найманского ханства, были опорой государственности: как ковш собирает и раздаёт, так и род собирал народ и делился силой.`,
                famous: `Атақты адамдар:\n\n★ Кучлук (? – 1218)\nПоследний хан Найманов. После поражения от Чингисхана бежал на запад и правил государством Кара-Китай.\n\n★ Ақжол бий (XV–XVI вв.)\nВеликий судья Найманов, хранитель обычного права «Жеты Жаргы».\n\n★ Мәди Бапиұлы (1880–1935)\nНародный акын, хранитель эпической традиции.`,
                traditions: `Дәстүрлер:\n\n• «Хан тізе» — уважение к старейшинам как к ханам.\n• Традиция письменности: Найман первыми среди кочевников использовали уйгурское письмо.\n• «Той жарысы» — состязание акынов как обязательная часть любого торжества.`,
                location: `Мекен:\n\nВосточно-Казахстанская, Семейская, Абайская области. Исторически — Верхний Иртыш и Алтай.`

            qonyrat: {
                history: `Қоңырат — дипломатический род казахской степи. Из него происходила Борте — главная жена Чингисхана. Матери ханов делали Конырат незаменимыми советниками.\n\nКоныраты были искусными переговорщиками: их дочерей брали в жёны правители, обеспечивая через них мир и союзы.`,
                tamga: `Тамға «Босаға» (∏) — дверная рама юрты, порог.\n\nТот, кто стоит у порога, контролирует вход и выход. Конырат стоял у ворот власти — через их дочерей проходила ханская линия.`,
                famous: `Атақты адамдар:\n\n★ Борте-хатун (ок. 1161–1230)\nГлавная жена Чингисхана, мать его четырёх сыновей. Из рода Конырат. Оказала огромное влияние на политику Монгольской империи.\n\n★ Тама би (XVIII в.)\nВеликий би, один из создателей «Жеты Жаргы» при Тауке хане.`,
                traditions: `Дәстүрлер:\n\n• «Бесік той» — особый пышный обряд первой колыбели, символизирующий новое начало.\n• «Ұзату» — торжественные проводы невесты с богатым приданым.\n• Традиция дипломатии: Конырат всегда первыми предлагали мирные переговоры.`,
                location: `Мекен:\n\nКызылординская, Туркестанская области. Исторически — Приаралье и низовья Сырдарьи.`

            qypshaq: {
                history: `🌍 От Карпат до Иртыша — вся эта земля называлась одним именем: Дешт-и-Кыпчак. Кыпчакская степь. И она принадлежала Қыпшақ.\n\nXII век. Кыпчаки — сильнейший народ евразийской степи. Их язык стал языком международного общения всей Золотой Орды — как английский сегодня.\n\n⚔️ Монголы пришли и разметали кыпчакских ханов. Часть бежала в Египет. И вот — невероятный поворот истории: кыпчакский раб Бейбарс становится султаном Египта. В 1260 году именно он — потомок степи — остановил монгольскую армию в битве при Айн-Джалуте. Единственный народ, победивший монголов в открытом бою!\n\n🎶 Другой кыпшак — Бухар жырау — стоял рядом с Абылай ханом и пел правду в лицо власти. Таков Қыпшақ: воин и поэт, раб и султан, кочевник и строитель империй.`,
                tamga: `Тамға «Қос әліп» (∥) — двойная буква «алиф».\n\nДве вертикальные черты — два столпа, две опоры. Әліп — первая буква арабского алфавита, прямая как копьё. Кыпчаки стояли на двух берегах истории — восток и запад, степь и город, война и торговля.`,
                famous: `Атақты адамдар:\n\n★ Бейбарс (Байбарс) (1223–1277)\nМамлюкский султан Египта кыпчакского происхождения. Остановил монгольскую экспансию в битве при Айн-Джалуте (1260). Освободил Египет и Сирию.\n\n★ Бухар жырау (1693–1787)\nВеликий акын-жырау, советник Абылай хана. Его жыры — классика казахской поэзии.\n\n★ Котян хан (? – 1241)\nПоследний великий хан кыпчаков. Бежал от монголов с 40 000 семьями в Венгрию.`,
                traditions: `Дәстүрлер:\n\n• «Жорық жолы» — воинские ритуалы: благословение воина перед походом.\n• «Найза сындырмау» — не ломать копьё без победы — кодекс воинской чести.\n• Традиция жырау — акыны-пророки, открыто говорившие правду ханам.`,
                location: `Мекен:\n\nКостанайская, Актюбинская, Западно-Казахстанская области. Исторически — вся Великая Степь.`
            },
            kerey: {
                history: `🏴 1465 год. Это дата рождения казахского народа как единой нации. И Керей стоит у самых её истоков.\n\nКерей-хан и Жанибек-хан сделали то, что казалось невозможным: они откочевали от деспота Абулхайра, увели с собой тысячи семей — и основали в Жетысу первое независимое Казахское ханство. Этот акт смелости стал актом рождения народа.\n\nИмя «казак» в те времена означало «вольный, отколовшийся». Керей и Жанибек стали первыми, кто выбрал свободу вместо подчинения.\n\n⚔️ Три века спустя — Абылай хан из рода Керей снова объединил три жуза, когда джунгары поставили нацию на грань уничтожения. История повторилась: потомок основателей снова спас народ.\n\nКерей — это не просто род. Это колыбель казахской государственности.`,
                tamga: `Тамға «Абақ» (⊕) — колёсо или крест в круге, символ вечного движения.\n\nОзначает неостановимую силу рода и колесо истории, которое Керей привели в движение в 1465 году.`,
                famous: `Атақты адамдар:\n\n★ Керей хан (? – 1473)\nПервый хан Казахского ханства (1465). Вместе с Жанибеком основал государство казахов. Главный символ казахской государственности.\n\n★ Абылай хан (1711–1781)\nВеликий хан, объединивший три жуза. Политик и воин, лавировавший между Россией, Китаем и Джунгарией. Изображён на казахской купюре.`,
                traditions: `Дәстүрлер:\n\n• «Хан жолы» — традиция уважения к государственности и власти.\n• «Ұлан той» — праздник первого шага мальчика как символа будущего батыра.\n• Хранение эпических преданий о Керей-хане как основателе нации.`,
                location: `Мекен:\n\nВосточно-Казахстанская, Семейская области. Исторически — Жетысу и Прииртышье.`
            },
            uaq: {
                history: `Уақ — воинственный и сплочённый род Орта жуза. Небольшой размер всегда компенсировался боевым духом и верностью.\n\nАктивно участвовали в антиджунгарских войнах XVIII века. Принцип Уака: «Нас мало, но каждый стоит десятерых».`,
                tamga: `Тамға «Ергенек» (◧) — приставная дверь юрты, наполовину прикрытая кошмой.\n\nЕргенек — решётчатая дверца у входа. Символ дома, который всегда открыт для своих и закрыт для чужих. Уақ — воинственный род, охранявший вход в свою землю. В источниках тамга Уақ приводится также как «шоға» и «ай».`,
                famous: `Атақты адамдар:\n\n★ Уақ батырлары (XVIII в.)\nВоины, участники Аныракайской битвы 1730 года. Прославились неожиданными флангов атаками.`,
                traditions: `Дәстүрлер:\n\n• «Ер намысы» — кодекс чести: нельзя оставить сородича в беде.\n• Особая кухня Уака: бесбармак с дикими травами степи.\n• «Кіші жиын» — частые малые собрания рода для быстрого решения проблем.`,
                location: `Мекен:\n\nКарагандинская и Павлодарская области. Северо-центральный Казахстан.`

            alimuly: {
                history: `Әлімұлы — крупнейшее объединение Младшего жуза из шести родов: Қаракесек, Қарамашақ, Торы-Айғыр, Шомекей, Кете, Шеркеш.\n\nИсторически кочевали между Аралом и рекой Яик. Из Алимулы вышли батыры, защищавшие западные рубежи от Persian и Khivan угроз. Основная политическая сила Кіші жуза.`,
                tamga: `Тамға «Шеге» (⫝) — гвоздь, символ твёрдости и незыблемости.\n\nКак гвоздь держит конструкцию вместе, так Әлімұлы скрепляет шесть родов в единое целое. Гвоздь не вытащить — нельзя сломить.`,
                famous: `Атақты адамдар:\n\n★ Жалантос Бахадур (1576–1656)\nИз рода Алимулы. Построил медресе Шер-Дор на Самаркандском Регистане. Покровитель наук и искусств.\n\n★ Батыры Алимулы (XVIII в.)\nЗащитники западных рубежей Казахского ханства.`,
                traditions: `Дәстүрлер:\n\n• «Алты ру бірлігі» — единство шести родов — высшая ценность Алимулы.\n• «Шеге қаққан» — закрепление договора символическим забиванием гвоздя.\n• «Ру жиыны» — большой родовой съезд для решения важных вопросов.`,
                location: `Мекен:\n\nАктюбинская, Западно-Казахстанская области. Приаралье, река Эмба.`

        // ── Полное шежіре Қарамашақ-Төртқара (tumalas.kz, 28 644 имени) — подгружается и прививается к нашей ветке ──
        const TORTKARA = { ready: false, failed: false, count: 0, promise: null };
        const normName = x => String(x).toLowerCase().replace(/…/g, '').replace(/[\s\-–—]+/g, '');
        let tkId = 0;
        function tkName(x) { return (Array.isArray(x) ? x[0] : x).replace(/…$/, '').trim(); }
        function tkConvert(x, gen) {
            const arr = Array.isArray(x), name = tkName(x), node = { id: 'tk' + (tkId++), name, gen };
            if (!arr && /…$/.test(x)) { node.more = true; node.era = 'әрі қарай — tumalas.kz'; }
            if (arr) node.children = x[1].map(c => tkConvert(c, gen + 1));
            TORTKARA.count++; return node;
        }
        function graftInto(our, tk) {
            const kids = Array.isArray(tk) ? tk[1] : []; if (!kids.length) return;
            const ours = (our.children || []).slice(), used = new Set(), out = [];
            const kidNames = new Set(kids.map(k => normName(tkName(k))));
            kids.forEach(k => { const nm = normName(tkName(k)); const o = ours.find(c => !used.has(c) && normName(c.name) === nm);

                else out.push(tkConvert(k, (our.gen || 0) + 1)); });
            ours.forEach(o => { if (!used.has(o)) out.push(o); });
            our.children = out;
        }
        function findNodeById(n, id) { if (n.id === id) return n; for (const c of n.children || []) { const r = findNodeById(c, id); if (r) return r; } return null; }
        function loadTortkara() {
            if (TORTKARA.promise) return TORTKARA.promise;
            TORTKARA.promise = fetch(new URL('data/tortkara.json', document.baseURI)).then(r => r.ok ? r.json() : Promise.reject(r.status))
                .then(json => { const t = findNodeById(TREE_DATA, 'tortqara'); if (t) { graftInto(t, json); t.era = (t.era || 'Төртқара атасы') + ' · шежіре: tumalas.kz'; } TORTKARA.ready = true; })
                .catch(e => { console.warn('Төртқара шежіресі жүктелмеді', e); TORTKARA.ready = true; TORTKARA.failed = true; });

        let _moreCount = null; const MORE_COUNT = () => { if (_moreCount == null) { let c = 0; const w = n => { if (n.more) c++; (n.children || []).forEach(w); }; w(TREE_DATA); _moreCount = c; } return _moreCount.toLocaleString('ru-RU'); };

        function ShezhireTreeSection({ onBack, onList }) {

                let tries = 0; const go = () => { const el = document.getElementById('node-' + id); if (el) { document.querySelectorAll('.tree-found').forEach(x => { x.classList.remove('tree-found'); x.style.boxShadow = ''; }); const c = el.firstElementChild; c.classList.add('tree-found'); c.style.boxShadow = '0 0 0 2px #F0D882, 0 0 24px rgba(240,216,130,.5)'; el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' }); } else if (tries++ < 20) setTimeout(go, 100); }; setTimeout(go, 80); };

                if (dup) { setErr(`«${dup.name}» деген ру базада бар · Такой род уже есть`); return; }
                const key = saveCustomTribe({ ...f, name: name.toUpperCase(), tamga: f.tamga.trim(), tamgaName: f.tamgaName.trim(), color: '#C5A55A' }, owner);
                onSaved(key);
            };
            const lbl = "text-[#C5A55A60] text-[9px] tracking-widest uppercase mb-2";
            const inp = "w-full bg-transparent border-b text-white text-base outline-none py-2 placeholder-[#2a2a2a] transition-colors";
            const area = "w-full rounded-xl px-4 py-3 text-sm text-white outline-none resize-none leading-relaxed";
            return (
                <div className="rounded-2xl p-px" style={{ background: 'linear-gradient(135deg,rgba(197,165,90,0.35),rgba(139,105,20,0.1))' }}>
                    <div className="rounded-2xl p-6 md:p-8 space-y-6" style={{ background: '#0d0d0d' }}>
                        <div>
                            <p className="text-[#C5A55A] text-[9px] tracking-[0.5em] uppercase mb-2">ӨЗ РУЫҢДЫ ҚОС · ДОБАВИТЬ СВОЙ РОД</p>
                            <h3 className="text-2xl font-serif text-white">Жаңа ру</h3>
                            <p className="text-[#444] text-xs mt-1">Род появится в списке родов, в чате и в вашем профиле. Хранится в этом браузере.</p>
                        </div>

                        <div className="grid md:grid-cols-2 gap-6">
                            <div>
                                <p className={lbl}>Ру атауы · Название рода</p>
                                <input value={f.name} onChange={e => set('name', e.target.value)} placeholder="Мысалы: ТАМА" autoFocus
                                    className={inp} style={{ borderColor: f.name ? '#C5A55A' : '#1a1a1a' }} />
                            </div>
                            <div>
                                <p className={lbl}>Жүз</p>
                                <div className="flex gap-2 flex-wrap">
                                    {[ZHUZES.ULY, ZHUZES.ORTA, ZHUZES.KISHI].map(z => (
                                        <button key={z} type="button" onClick={() => set('juz', z)}
                                            className="px-4 py-2 rounded-full text-[10px] tracking-widest uppercase border transition-all"
                                            style={{ borderColor: f.juz === z ? '#C5A55A' : '#1a1a1a', color: f.juz === z ? '#C5A55A' : '#444', background: f.juz === z ? 'rgba(197,165,90,0.08)' : 'transparent' }}>
                                            {z}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div>
                            <p className={lbl}>Тамға · Тамга</p>
                            <div className="flex items-start gap-5">
                                <div className="w-20 h-20 shrink-0 rounded-2xl flex items-center justify-center text-5xl text-[#C5A55A] tamga-glow border" style={{ borderColor: '#C5A55A40', background: '#080808' }}>
                                    {f.tamga || '?'}
                                </div>
                                <div className="flex-1 space-y-3">
                                    <div className="grid grid-cols-9 sm:grid-cols-12 gap-1">
                                        {TAMGA_PALETTE.map(g => (
                                            <button key={g} type="button" onClick={() => set('tamga', g)}
                                                className="aspect-square rounded-lg text-xl flex items-center justify-center border transition-all hover:scale-110"
                                                style={{ borderColor: f.tamga === g ? '#C5A55A' : '#161616', color: f.tamga === g ? '#C5A55A' : '#666', background: f.tamga === g ? 'rgba(197,165,90,0.1)' : 'transparent' }}>
                                                {g}
                                            </button>
                                        ))}
                                    </div>
                                    <input value={f.tamga} onChange={e => set('tamga', e.target.value.slice(0, 2))} placeholder="немесе өз символыңыз · или свой символ"
                                        className={inp + " text-sm"} style={{ borderColor: '#1a1a1a' }} />
                                </div>
                            </div>
                        </div>

                        <div className="grid md:grid-cols-2 gap-6">
                            <div>
                                <p className={lbl}>Тамға атауы · Название тамги</p>
                                <input value={f.tamgaName} onChange={e => set('tamgaName', e.target.value)} placeholder="Мысалы: Көсеу, Абақ, Тарақ"
                                    className={inp} style={{ borderColor: f.tamgaName ? '#C5A55A' : '#1a1a1a' }} />
                            </div>
                            <div>
                                <p className={lbl}>Тамға мағынасы · Что означает</p>
                                <textarea value={f.tamgaStory} onChange={e => set('tamgaStory', e.target.value)} rows={2} placeholder="Символ чего…"
                                    className={area} style={{ background: '#080808', border: '1px solid #1e1e1e', caretColor: '#C5A55A' }} />
                            </div>
                        </div>

                        <div>
                            <p className={lbl}>Рудың тарихы · История рода</p>
                            <textarea value={f.story} onChange={e => set('story', e.target.value)} rows={4} placeholder="Откуда род, чем известен, где кочевал…"
                                className={area} style={{ background: '#080808', border: '1px solid #1e1e1e', caretColor: '#C5A55A' }} />
                        </div>

                        {err && <p className="text-red-400 text-[10px] tracking-wide">{err}</p>}
                        <div className="flex gap-3">
                            {onCancel && <button type="button" onClick={onCancel} className="flex-1 py-3.5 rounded-2xl border border-[#1a1a1a] text-[#444] text-xs tracking-widest hover:border-[#333] transition-colors">БОЛДЫРМАУ</button>}
                            <button type="button" onClick={save}
                                className="flex-1 py-3.5 rounded-2xl font-bold text-sm tracking-widest transition-all hover:scale-105"
                                style={{ background: 'linear-gradient(135deg,#C5A55A,#8B6914)', color: '#000' }}>
                                РУДЫ САҚТАУ ✓
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function ProfileScreen({ onBack }) {
            // ── Login state ──
            const [loggedUser, setLoggedUser] = useState(() => localStorage.getItem('shejire_user') || null);
            const [loginForm,  setLoginForm]  = useState({ login: '', pass: '' });
            const [loginErr,   setLoginErr]   = useState('');

            // ── Profile state (per-user) ──
            const [profile, setProfile] = useState(() => {
                const u = localStorage.getItem('shejire_user');
                if (!u) return null;
                try {
                    const saved = JSON.parse(localStorage.getItem('shejire_profile_' + u) || 'null');
                    if (saved && saved.lineage) return saved;
                    const def = CABINET_USERS[u]?.profile;
                    if (def) { localStorage.setItem('shejire_profile_' + u, JSON.stringify(def)); return def; }
                } catch {}
                return null;
            });

            const [step, setStep]         = useState(0);
            const [form, setForm]         = useState({ name: '', tribe: '', lineage: '' });
            const [tab,  setTab]          = useState('tree');
            const [showCert, setShowCert] = useState(false);
            const [editing, setEditing]   = useState(false);
            const [customVer, setCustomVer]     = useState(0);     // перерисовать после добавления/удаления рода
            const [showAddTribe, setShowAddTribe] = useState(false);

            // вход: берём сохранённый профиль пользователя, иначе — профиль по умолчанию
            const enterCabinet = (u) => {
                let p = null;
                try { p = JSON.parse(localStorage.getItem('shejire_profile_' + u.login) || 'null'); } catch {}
                if (!p || !p.lineage) p = u.profile;
                if (p.tribe && !TRIBES_DB[p.tribe] && TRIBES_DB[u.profile.tribe]) p = { ...p, tribe: u.profile.tribe };
                localStorage.setItem('shejire_user', u.login);
                localStorage.setItem('shejire_profile_' + u.login, JSON.stringify(p));
                setProfile(p);
                setLoggedUser(u.login);
            };
            const doLogin = () => {
                const u = Object.values(CABINET_USERS).find(u => u.login === loginForm.login.trim() && u.pass === loginForm.pass.trim());
                if (!u) { setLoginErr('Логин немесе пароль қате · Неверный логин или пароль'); return; }
                enterCabinet(u);
                setLoginErr('');
            };
            const doLogout = () => {
                localStorage.removeItem('shejire_user');
                setLoggedUser(null);
                setProfile(null);
                setLoginForm({ login: '', pass: '' });
                setStep(0); setForm({ name: '', tribe: '', lineage: '' });
            };

            const setMyTribe = (key) => {
                const p = { ...profile, tribe: key };
                localStorage.setItem('shejire_profile_' + loggedUser, JSON.stringify(p));
                setProfile(p);
            };

            const saveProfile = () => {
                const p = { ...(CABINET_USERS[loggedUser]?.profile || {}), ...form, createdAt: new Date().toISOString() };
                localStorage.setItem('shejire_profile_' + loggedUser, JSON.stringify(p));
                setProfile(p); setEditing(false);
            };
            const logout = doLogout;

            // ── Login screen ──
            if (!loggedUser) return (
                <div className="min-h-screen flex flex-col items-center justify-center px-4 py-16 relative">
                    <button onClick={onBack} className="fixed top-6 left-6 text-[#444] hover:text-[#C5A55A] transition-colors text-[10px] tracking-widest uppercase z-10">← Назад</button>
                    <div className="max-w-sm w-full space-y-8">
                        <div className="text-center">
                            <div className="text-5xl mb-4 tamga-glow" style={{fontFamily:"'Cinzel',serif"}}>⩔</div>
                            <p className="text-[#C5A55A] text-[9px] tracking-[0.5em] uppercase mb-3">ЖЕКЕ КАБИНЕТ · ЛИЧНЫЙ КАБИНЕТ</p>
                            <h2 className="text-4xl font-serif text-white">Кіру</h2>
                            <p className="text-[#444] text-xs mt-2 tracking-wide">Войдите в свой аккаунт</p>
                        </div>

                        <div className="rounded-2xl p-px" style={{background:'linear-gradient(135deg,rgba(197,165,90,0.3),rgba(139,105,20,0.1))'}}>
                            <div className="rounded-2xl p-7 space-y-5" style={{background:'#0d0d0d'}}>
                                <div>
                                    <p className="text-[#C5A55A60] text-[9px] tracking-widest uppercase mb-2">ЛОГИН</p>
                                    <input value={loginForm.login}
                                        onChange={e => { setLoginForm(f=>({...f,login:e.target.value})); setLoginErr(''); }}
                                        onKeyDown={e => e.key==='Enter' && doLogin()}
                                        placeholder="aset / arsen"
                                        autoFocus
                                        className="w-full bg-transparent border-b text-white text-lg outline-none py-2 placeholder-[#222] transition-colors"
                                        style={{borderColor: loginForm.login ? '#C5A55A' : '#1a1a1a'}} />
                                </div>
                                <div>
                                    <p className="text-[#C5A55A60] text-[9px] tracking-widest uppercase mb-2">ПАРОЛЬ</p>
                                    <input value={loginForm.pass} type="password"
                                        onChange={e => { setLoginForm(f=>({...f,pass:e.target.value})); setLoginErr(''); }}
                                        onKeyDown={e => e.key==='Enter' && doLogin()}
                                        placeholder="••••••••"
                                        className="w-full bg-transparent border-b text-white text-lg outline-none py-2 placeholder-[#222] transition-colors"
                                        style={{borderColor: loginForm.pass ? '#C5A55A' : '#1a1a1a'}} />
                                </div>
                                {loginErr && <p className="text-red-400 text-[10px] tracking-wide text-center">{loginErr}</p>}
                                <button onClick={doLogin}
                                    className="w-full py-4 rounded-xl font-bold text-sm tracking-widest transition-all hover:scale-105 active:scale-95 mt-2"
                                    style={{background:'linear-gradient(135deg,#C5A55A,#8B6914)',color:'#000'}}>
                                    КІРУ →
                                </button>
                            </div>
                        </div>

                        <div className="text-center space-y-3">
                            <p className="text-[#2a2a2a] text-[9px] tracking-widest uppercase">Немесе тікелей кіріңіз</p>
                            <div className="grid grid-cols-2 gap-2">
                                {Object.values(CABINET_USERS).map(u => (
                                    <button key={u.login} onClick={() => enterCabinet(u)}
                                        className="flex items-center gap-3 px-4 py-3 rounded-xl border transition-all hover:border-[#C5A55A] hover:bg-[#C5A55A0A] text-left"
                                        style={{borderColor:'#1a1a1a'}}>
                                        <span className="text-xl">{TRIBES_DB[u.profile?.tribe]?.tamga || '⩔'}</span>
                                        <div>
                                            <p className="text-white text-sm font-semibold">{u.profile?.name}</p>
                                            <p className="text-[#444] text-[9px] tracking-wide">{u.login} · {u.pass}</p>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );

            const lineageLines = (profile?.lineage || '').split('\n').filter(Boolean);
            const tribe = profile?.tribe ? TRIBES_DB[profile.tribe] : null;

            const openPrint = () => {
                setShowCert(true);
                setTimeout(() => window.print(), 400);
            };

            /* ── Onboarding flow ── */
            if (!profile) return (
                <div className="min-h-screen flex flex-col items-center justify-center px-4 py-16 relative">
                    <button onClick={onBack} className="fixed top-6 left-6 text-[#444] hover:text-[#C5A55A] transition-colors text-[10px] tracking-widest uppercase z-10">← Назад</button>

                    {/* Step dots */}
                    <div className="flex gap-2 mb-14">
                        {[0,1,2].map(i => (
                            <div key={i} className="transition-all duration-500 rounded-full"
                                style={{ width: step === i ? 28 : 8, height: 8, background: step >= i ? '#C5A55A' : '#1a1a1a' }} />
                        ))}
                    </div>

                    {/* Step 0 — name */}
                    {step === 0 && (
                        <div className="max-w-md w-full text-center space-y-10 animate-fadeIn">
                            <div>
                                <p className="text-[#C5A55A] text-[9px] tracking-[0.5em] uppercase mb-5">ЖЕКЕ КАБИНЕТ · ЛИЧНЫЙ КАБИНЕТ</p>
                                <h2 className="text-5xl font-serif mb-4">Атыңыз кім?</h2>
                                <p className="text-[#444] text-sm leading-relaxed">Как вас зовут? Это отобразится в профиле и PDF-сертификате.</p>
                            </div>
                            <input value={form.name} onChange={e => setForm(f => ({...f, name: e.target.value}))}
                                onKeyDown={e => e.key === 'Enter' && form.name.trim() && setStep(1)}
                                placeholder="Аты-жөніңіз..."
                                autoFocus
                                className="w-full bg-transparent border-b-2 text-center text-3xl py-3 text-white outline-none transition-colors placeholder-[#222]"
                                style={{ borderColor: form.name ? '#C5A55A' : '#1a1a1a' }} />
                            <button onClick={() => form.name.trim() && setStep(1)} disabled={!form.name.trim()}
                                className="w-full py-4 rounded-2xl font-bold text-sm tracking-widest transition-all duration-300 hover:scale-105 active:scale-95"
                                style={{ background: form.name.trim() ? 'linear-gradient(135deg,#C5A55A,#8B6914)' : '#111', color: form.name.trim() ? '#000' : '#333' }}>
                                КЕЛЕСІ →
                            </button>
                        </div>
                    )}

                    {/* Step 1 — tribe */}
                    {step === 1 && (
                        <div className="max-w-2xl w-full space-y-10">
                            <div className="text-center">
                                <p className="text-[#C5A55A] text-[9px] tracking-[0.5em] uppercase mb-5">РУДЫ ТАҢДА · ВЫБЕРИТЕ РОД</p>
                                <h2 className="text-5xl font-serif mb-4">Қай рудансыз?</h2>
                                <p className="text-[#444] text-sm">Ваш род — основа шежіре и цифровой идентичности.</p>
                            </div>
                            {showAddTribe && (
                                <AddTribeForm owner={loggedUser}
                                    onSaved={key => { setForm(f => ({ ...f, tribe: key })); setShowAddTribe(false); setCustomVer(v => v + 1); }}
                                    onCancel={() => setShowAddTribe(false)} />
                            )}
                            <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
                                {Object.entries(TRIBES_DB).map(([key, t]) => (
                                    <button key={key} onClick={() => setForm(f => ({...f, tribe: key}))}
                                        className="flex flex-col items-center gap-2 p-3 rounded-xl border transition-all duration-200 hover:scale-105"
                                        style={{
                                            borderColor: form.tribe === key ? '#C5A55A' : '#1a1a1a',
                                            background:  form.tribe === key ? 'rgba(197,165,90,0.1)' : 'transparent',
                                            color:       form.tribe === key ? '#C5A55A' : '#444',
                                        }}>
                                        <span className="text-2xl">{t.tamga}</span>
                                        <span className="text-[9px] tracking-wide font-semibold text-center leading-tight">{t.name}</span>
                                    </button>
                                ))}
                                <button onClick={() => setShowAddTribe(true)}
                                    className="flex flex-col items-center gap-2 p-3 rounded-xl border border-dashed transition-all duration-200 hover:scale-105 hover:border-[#C5A55A]"
                                    style={{ borderColor: '#2a2a2a', color: '#C5A55A' }}>
                                    <span className="text-2xl">＋</span>
                                    <span className="text-[9px] tracking-wide font-semibold text-center leading-tight">БАСҚА РУ<br/>свой род</span>
                                </button>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => setStep(0)} className="flex-1 py-3.5 rounded-2xl border border-[#1a1a1a] text-[#444] text-xs tracking-widest hover:border-[#333] transition-colors">← АРТҚА</button>
                                <button onClick={() => form.tribe && setStep(2)} disabled={!form.tribe}
                                    className="flex-1 py-3.5 rounded-2xl font-bold text-sm tracking-widest transition-all hover:scale-105"
                                    style={{ background: form.tribe ? 'linear-gradient(135deg,#C5A55A,#8B6914)' : '#111', color: form.tribe ? '#000' : '#333' }}>
                                    КЕЛЕСІ →
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Step 2 — lineage */}
                    {step === 2 && (
                        <div className="max-w-lg w-full space-y-8">
                            <div className="text-center">
                                <p className="text-[#C5A55A] text-[9px] tracking-[0.5em] uppercase mb-5">ШЕЖІРЕ ТІЗБЕГІ · ЦЕПОЧКА ПРЕДКОВ</p>
                                <h2 className="text-5xl font-serif mb-4">Ата-баба тізбегі</h2>
                                <p className="text-[#444] text-sm leading-relaxed">Введите предков по одному на строку — от себя к первому предку.<br/>Вы → Отец → Дед → ...</p>
                            </div>
                            <div className="relative">
                                <textarea value={form.lineage} onChange={e => setForm(f => ({...f, lineage: e.target.value}))}
                                    placeholder={"Сіздің атыңыз\nӘкеңіздің аты\nАтаңыздың аты\nАтаның атасы\n..."}
                                    rows={9}
                                    className="w-full rounded-2xl px-6 py-5 text-sm text-white outline-none transition-colors resize-none leading-relaxed"
                                    style={{ background: '#0d0d0d', border: '1px solid #1e1e1e', caretColor: '#C5A55A' }} />
                                <div className="absolute top-4 right-4 text-[#333] text-[10px] tracking-widest">
                                    {form.lineage.split('\n').filter(Boolean).length} ата
                                </div>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => setStep(1)} className="flex-1 py-3.5 rounded-2xl border border-[#1a1a1a] text-[#444] text-xs tracking-widest hover:border-[#333] transition-colors">← АРТҚА</button>
                                <button onClick={saveProfile}
                                    className="flex-1 py-3.5 rounded-2xl font-bold text-sm tracking-widest transition-all hover:scale-105"
                                    style={{ background: 'linear-gradient(135deg,#C5A55A,#8B6914)', color: '#000' }}>
                                    ПРОФИЛЬ ЖАСАУ ✓
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );

            /* ── Dashboard ── */
            return (
                <div className="max-w-5xl mx-auto px-4 py-10 min-h-screen">

                    {/* Top bar */}
                    <div className="flex items-center justify-between mb-10">
                        <button onClick={onBack} className="text-[#444] hover:text-[#C5A55A] transition-colors text-[10px] tracking-widest uppercase flex items-center gap-2">← Назад</button>
                        <div className="flex gap-2">
                            <button onClick={() => { setEditing(true); setForm({ name: profile.name, tribe: profile.tribe||'', lineage: profile.lineage||'' }); setStep(0); setProfile(null); }}
                                className="text-[10px] tracking-widest text-[#C5A55A] transition-colors uppercase border border-[#C5A55A30] px-3 py-1.5 rounded-full hover:border-[#C5A55A] hover:bg-[#C5A55A0A]">
                                ✏ Өзгерту
                            </button>
                            <button onClick={logout} className="text-[10px] tracking-widest text-[#333] hover:text-[#666] transition-colors uppercase border border-[#1a1a1a] px-3 py-1.5 rounded-full hover:border-[#333]">Шығу</button>
                        </div>
                    </div>

                    {/* ── Profile card ── */}
                    <div className="rounded-3xl p-px mb-8 overflow-hidden" style={{ background: 'linear-gradient(135deg,rgba(197,165,90,0.4),rgba(139,105,20,0.1),rgba(197,165,90,0.2))' }}>
                        <div className="rounded-3xl p-7 md:p-10 relative overflow-hidden" style={{ background: '#0d0d0d' }}>
                            {/* Glow bg */}
                            <div className="absolute inset-0 pointer-events-none" style={{ background: 'radial-gradient(ellipse at 80% 20%, rgba(197,165,90,0.07) 0%, transparent 60%)' }} />

                            <div className="flex flex-col md:flex-row items-center md:items-start gap-7 relative z-10">
                                {/* Avatar ring */}
                                <div className="profile-ring shrink-0">
                                    <div className="w-24 h-24 rounded-full flex items-center justify-center text-5xl" style={{ background: '#0d0d0d' }}>
                                        {tribe?.tamga || '⩔'}
                                    </div>
                                </div>

                                <div className="flex-1 text-center md:text-left">
                                    <p className="text-[#C5A55A60] text-[9px] tracking-[0.5em] uppercase mb-2">ЖЕКЕ КАБИНЕТ</p>
                                    <h2 className="text-3xl md:text-4xl font-serif text-white mb-1">{profile.name}</h2>
                                    <p className="text-[#666] text-sm tracking-widest mb-5">
                                        {tribe?.name || '—'} · {tribe?.juz || ''}
                                    </p>

        // ── Чат по истории рода ──
        const SUGGESTIONS = {
            history:     [{ label: '⩔ Тамғасы', q: 'тамга' }, { label: '🌟 Батырлары', q: 'известные люди' }, { label: '🗺 Мекені', q: 'где жили' }],
            tamga:       [{ label: '📜 Тарихы', q: 'история' }, { label: '🏕 Дәстүрлер', q: 'традиции' }, { label: '🌟 Батырлары', q: 'известные люди' }],
            famous:      [{ label: '📜 Тарихы', q: 'история' }, { label: '🏕 Дәстүрлер', q: 'традиции' }, { label: '⩔ Тамғасы', q: 'тамга' }],
            traditions:  [{ label: '🌟 Батырлары', q: 'известные люди' }, { label: '📜 Тарихы', q: 'история' }, { label: '🗺 Мекені', q: 'где жили' }],
            location:    [{ label: '📜 Тарихы', q: 'история' }, { label: '⩔ Тамғасы', q: 'тамга' }, { label: '🏕 Дәстүрлер', q: 'традиции' }],
            general:     [{ label: '📜 Тарихы', q: 'история' }, { label: '⩔ Тамғасы', q: 'тамга' }, { label: '🌟 Батырлары', q: 'известные люди' }],
        };

        function ChatScreen({ onBack }) {
            const [selectedTribe, setSelectedTribe] = useState(null);
            const [messages, setMessages]           = useState([]);
            const [input, setInput]                 = useState('');
            const [isTyping, setIsTyping]           = useState(false);
            const messagesEndRef                    = useRef(null);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isTyping]);

            const tribeEntries = Object.entries(TRIBES_DB);

            const getResponse = (query, key) => {
                const k = TRIBES_KNOWLEDGE[key];
                const t = TRIBES_DB[key];
                if (!k) return { text: `${t.name} рода туралы мәліметтер толықтырылуда.\n\n${t.story}`, sugg: SUGGESTIONS.general };
                const q = query.toLowerCase();
                if (q.includes('тарих') || q.includes('истори') || q.includes('откуда') || q.includes('происх'))
                    return { text: k.history, sugg: SUGGESTIONS.history };
                if (q.includes('тамга') || q.includes('символ') || q.includes('знак') || q.includes('тамға'))
                    return { text: k.tamga, sugg: SUGGESTIONS.tamga };
                if (q.includes('атақ') || q.includes('извест') || q.includes('люди') || q.includes('герой') || q.includes('батыр') || q.includes('адамд'))
                    return { text: k.famous, sugg: SUGGESTIONS.famous };
                if (q.includes('дәст') || q.includes('традиц') || q.includes('обычай') || q.includes('обряд'))
                    return { text: k.traditions, sugg: SUGGESTIONS.traditions };
                if (q.includes('мекен') || q.includes('где') || q.includes('жили') || q.includes('земля') || q.includes('территор'))
                    return { text: k.location, sugg: SUGGESTIONS.location };
                return { text: `${t.tamga}  ${t.name}\n${t.juz}\n\n${t.story}`, sugg: SUGGESTIONS.general };
            };

            const ts = () => new Date().toLocaleTimeString('kk', { hour: '2-digit', minute: '2-digit' });

            const selectTribe = (key) => {
                setSelectedTribe(key);
                const t = TRIBES_DB[key];
                setMessages([{
                    role: 'bot',
                    text: `Сәлем! Мен ${t.name} рудың тарихын жақсы білемін.\n\nТөмендегі тақырыптардың бірін таңдаңыз немесе өз сұрағыңызды жазыңыз.`,
                    sugg: SUGGESTIONS.general,
                    ts: ts()
                }]);
            };

            const clearChat = () => {
                if (!selectedTribe) return;
                selectTribe(selectedTribe);
            };

            const send = (text) => {
                if (!text.trim() || !selectedTribe) return;
                setMessages(prev => [...prev, { role: 'user', text, ts: ts() }]);
                setInput('');
                setIsTyping(true);
                setTimeout(() => {
                    const { text: resp, sugg } = getResponse(text, selectedTribe);
                    setMessages(prev => [...prev, { role: 'bot', text: resp, sugg, ts: ts() }]);
                    setIsTyping(false);
                }, 600 + Math.random() * 600);
            };

            return (
                <div className="min-h-screen flex flex-col" style={{ background: 'var(--bg-void)' }}>
                    <div className="max-w-7xl mx-auto w-full flex-1 flex flex-col" style={{ height: '100vh', maxHeight: '100vh' }}>

                        {/* ── Top bar ── */}

                            <button onClick={onBack}
                                className="flex items-center gap-2 text-[#555] hover:text-[#C5A55A] transition-colors text-[11px] tracking-widest uppercase">
                                ← <span className="hidden sm:inline">Назад</span>
                            </button>
                            <div className="text-center">
                                <p className="text-[#C5A55A] font-serif text-lg tracking-widest">РУ ЧАТЫ</p>
                                <p className="text-[#333] text-[8px] tracking-[0.3em] uppercase">Тарих · Тамға · Батырлар · Дәстүр</p>
                            </div>
                            <button onClick={clearChat} disabled={!selectedTribe}
                                className="flex items-center gap-1.5 text-[10px] tracking-widest uppercase transition-colors px-3 py-1.5 rounded-full border"
                                style={{
                                    borderColor: selectedTribe ? 'rgba(197,165,90,0.3)' : '#1a1a1a',
                                    color: selectedTribe ? '#C5A55A' : '#2a2a2a'
                                }}>
                                ↺ <span className="hidden sm:inline">Жаңадан</span>
                            </button>
                        </div>

                        <div className="flex flex-1 overflow-hidden">

                            {/* ── Sidebar (desktop) ── */}
                            <div className="hidden md:flex w-60 shrink-0 flex-col border-r border-[#111] overflow-y-auto">
                                <div className="px-4 pt-5 pb-3">
                                    <p className="text-[#2a2a2a] text-[9px] tracking-[0.3em] uppercase mb-3">Руды таңда</p>
                                    <div className="space-y-0.5">
                                        {tribeEntries.map(([key, t]) => (
                                            <button key={key} onClick={() => selectTribe(key)}
                                                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left transition-all duration-150 text-xs
                                                    ${selectedTribe === key
                                                        ? 'bg-[#C5A55A12] text-[#C5A55A]'
                                                        : 'text-[#444] hover:bg-[#111] hover:text-[#888]'}`}>
                                                <span className="text-base w-6 text-center shrink-0">{t.tamga}</span>
                                                <div className="min-w-0">
                                                    <p className="font-semibold tracking-wide truncate">{t.name}</p>
                                                    <p className="text-[8px] tracking-widest opacity-50 truncate">{t.juz}</p>
                                                </div>
                                                {selectedTribe === key && <span className="ml-auto w-1.5 h-1.5 rounded-full shrink-0" style={{ background: '#C5A55A' }} />}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* ── Main chat ── */}
                            <div className="flex-1 flex flex-col overflow-hidden">

                                {/* Mobile tribe strip */}
                                <div className="md:hidden flex gap-2 overflow-x-auto px-4 py-3 border-b border-[#111] shrink-0" style={{ scrollbarWidth: 'none' }}>
                                    {tribeEntries.map(([key, t]) => (
                                        <button key={key} onClick={() => selectTribe(key)}
                                            className={`shrink-0 flex flex-col items-center gap-1 px-3 py-2 rounded-xl transition-all
                                                ${selectedTribe === key ? 'bg-[#C5A55A14] border border-[#C5A55A40] text-[#C5A55A]' : 'border border-[#1a1a1a] text-[#444]'}`}>
                                            <span className="text-xl">{t.tamga}</span>
                                            <span style={{ fontSize: '8px' }} className="tracking-wider font-semibold">{t.name}</span>
                                        </button>
                                    ))}
                                </div>

                                {/* Chat header (active tribe) */}
                                {selectedTribe && (
                                    <div className="flex items-center gap-3 px-5 py-3 border-b border-[#111] shrink-0"
                                        style={{ background: 'rgba(197,165,90,0.03)' }}>
                                        <div className="w-10 h-10 rounded-full border border-[#C5A55A40] flex items-center justify-center text-xl"
                                            style={{ background: 'rgba(197,165,90,0.08)' }}>
                                            {TRIBES_DB[selectedTribe].tamga}
                                        </div>
                                        <div>
                                            <p className="text-white font-semibold text-sm tracking-wide">{TRIBES_DB[selectedTribe].name}</p>
                                            <p className="text-[#C5A55A] text-[10px] tracking-widest">{TRIBES_DB[selectedTribe].juz} · онлайн</p>
                                        </div>
                                    </div>
                                )}

                                {/* Empty state */}
                                {!selectedTribe ? (
                                    <div className="flex-1 flex items-center justify-center text-center p-8">
                                        <div>
