<!doctype html><meta charset="utf-8"><body>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.149.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.149.0/examples/jsm/"}}</script>
<script type="module">
// Этап B: скелет + привязка кожи + цикл ходьбы → models/heroes/bogenbay.glb
// Модель смотрит в +Z, левая сторона батыра — +X. Единицы исходника (подошва y ≈ 0.09, рост ≈ 0.81).
import * as T from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
const log = m => console.log('B', m);
const g = await new GLTFLoader().loadAsync('bogenbay_static.glb'); let src; g.scene.traverse(o => { if (o.isMesh) src = o; });
src.updateMatrixWorld(true); const geo0 = src.geometry.clone(); geo0.applyMatrix4(src.matrixWorld);

// ── 1. убираем мелкие оторванные куски (трава у сапог) ──
{ const idx = geo0.index.array, n = geo0.attributes.position.count, par = new Int32Array(n).map((_, i) => i);
  const f = a => { while (par[a] !== a) { par[a] = par[par[a]]; a = par[a]; } return a; };
  for (let t = 0; t < idx.length; t += 3) { const a = f(idx[t]), b = f(idx[t + 1]), c = f(idx[t + 2]); par[b] = a; par[f(c)] = a; }
  const cnt = new Map(); for (let t = 0; t < idx.length; t += 3) { const r = f(idx[t]); cnt.set(r, (cnt.get(r) || 0) + 1); }
  const keep = []; let drop = 0; const P = geo0.attributes.position;
  // трава: куски целиком ниже 0.16 и не внутри сапог (сапоги — тоже отдельные куски, их не трогаем)
  const maxY = new Map(), cx = new Map(), cz = new Map();
  for (let t = 0; t < idx.length; t++) { const r = f(idx[t]), y = P.getY(idx[t]); maxY.set(r, Math.max(maxY.get(r) ?? -9, y)); cx.set(r, (cx.get(r) || 0) + P.getX(idx[t])); cz.set(r, (cz.get(r) || 0) + P.getZ(idx[t])); }
  const boots = [[-0.165, -0.045, -0.05, 0.125], [0.045, 0.175, -0.095, 0.075]];
  const grass = r => { const n = cnt.get(r) * 3, x = cx.get(r) / n, z = cz.get(r) / n;
    if (maxY.get(r) < 0.22 && isYellow(r)) return true;                          // жёлтые травинки у сапог
    if (maxY.get(r) >= 0.16) return false;                                      // сапоги и плащ — выше
    if (!boots.some(([x0, x1, z0, z1]) => x >= x0 && x <= x1 && z >= z0 && z <= z1)) return true; // вне сапог — трава/камни
    return isYellow(r); };                                                      // в сапогах: подошва (коричневая) или травинка (жёлтая)
  // цвет куска по текстуре: жёлтая трава vs коричневая кожа сапог
  const img = src.material.map.image, cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height; const cx2 = cv.getContext('2d'); cx2.drawImage(img, 0, 0);
  const pix = cx2.getImageData(0, 0, cv.width, cv.height).data, UVa = geo0.attributes.uv, col = new Map();
  for (let t = 0; t < idx.length; t += 9) { const i = idx[t], r = f(i); const u = Math.min(cv.width - 1, Math.max(0, Math.floor(UVa.getX(i) * cv.width))), w = Math.min(cv.height - 1, Math.max(0, Math.floor(UVa.getY(i) * cv.height)));
    const o = (w * cv.width + u) * 4, c = col.get(r) || [0, 0, 0, 0]; c[0] += pix[o]; c[1] += pix[o + 1]; c[2] += pix[o + 2]; c[3]++; col.set(r, c); }
  const isYellow = r => { const c = col.get(r); if (!c || !c[3]) return false; return c[1] / Math.max(1, c[0]) > 0.72 && c[0] / c[3] > 120; };
  for (let t = 0; t < idx.length; t += 3) { const r = f(idx[t]); if (grass(r)) { drop++; continue; } keep.push(idx[t], idx[t + 1], idx[t + 2]); }
  geo0.setIndex(keep); log('dropped tris ' + drop + ' comps ' + cnt.size); }

// ── 2. скелет (позиции суставов в мировых координатах модели) ──
const J = {
  hips: [0, 0.42, 0], spine: [0, 0.5, -0.005], chest: [0, 0.6, -0.005], neck: [0, 0.715, 0], head: [0, 0.765, 0.02], headEnd: [0, 0.9, 0.02],
  shoulderL: [0.055, 0.68, 0], armL: [0.14, 0.665, 0], foreL: [0.165, 0.57, 0.04], handL: [0.1, 0.545, 0.12], handEndL: [0.08, 0.53, 0.16],
  shoulderR: [-0.055, 0.68, 0], armR: [-0.14, 0.665, 0], foreR: [-0.175, 0.55, 0], handR: [-0.155, 0.48, 0.02], handEndR: [-0.15, 0.44, 0.03],
  thighL: [0.075, 0.4, 0], shinL: [0.09, 0.26, 0.02], footL: [0.095, 0.14, 0], toeL: [0.095, 0.1, 0.1],
  thighR: [-0.075, 0.4, 0], shinR: [-0.09, 0.26, 0.02], footR: [-0.095, 0.14, 0], toeR: [-0.095, 0.1, 0.1],
};
const PARENT = { spine: 'hips', chest: 'spine', neck: 'chest', head: 'neck', headEnd: 'head',
  shoulderL: 'chest', armL: 'shoulderL', foreL: 'armL', handL: 'foreL', handEndL: 'handL',
  shoulderR: 'chest', armR: 'shoulderR', foreR: 'armR', handR: 'foreR', handEndR: 'handR',
  thighL: 'hips', shinL: 'thighL', footL: 'shinL', toeL: 'footL', thighR: 'hips', shinR: 'thighR', footR: 'shinR', toeR: 'footR' };
const names = Object.keys(J), bones = {};
names.forEach(n => { const b = new T.Bone(); b.name = n; bones[n] = b; });
names.forEach(n => { const p = PARENT[n], w = new T.Vector3(...J[n]); if (p) { bones[p].add(bones[n]); bones[n].position.copy(w.sub(new T.Vector3(...J[p]))); } else bones[n].position.copy(w); });
// «кости-отрезки» для весов: кость → её дочерний сустав
const SEG = { hips: 'spine', spine: 'chest', chest: 'neck', neck: 'head', head: 'headEnd', shoulderL: 'armL', armL: 'foreL', foreL: 'handL', handL: 'handEndL',
  shoulderR: 'armR', armR: 'foreR', foreR: 'handR', handR: 'handEndR', thighL: 'shinL', shinL: 'footL', footL: 'toeL', thighR: 'shinR', shinR: 'footR', footR: 'toeR' };
const segBones = Object.keys(SEG), boneIndex = Object.fromEntries(names.map((n, i) => [n, i]));
const A = segBones.map(n => new T.Vector3(...J[n])), B = segBones.map(n => new T.Vector3(...J[SEG[n]]));
const KIND = n => /^(thigh|shin|foot)/.test(n) ? 'leg' : /^(shoulder|arm|fore|hand)/.test(n) ? 'arm' : 'core';
const SIDE = n => n.endsWith('L') ? 1 : n.endsWith('R') ? -1 : 0;

// ── 3. веса кожи: расстояние до отрезков костей с ограничениями по зонам ──
const P = geo0.attributes.position, nv = P.count, SI = new Uint16Array(nv * 4), SW = new Float32Array(nv * 4), v = new T.Vector3(), q = new T.Vector3(), line = new T.Line3();
for (let i = 0; i < nv; i++) { v.fromBufferAttribute(P, i); const cand = [];
  // плащ: сзади и по бокам ниже пояса — не следует за ногами
  // плащ: сзади и по бокам ниже пояса — не следует за ногами; ниже подола (y < 0.235) видны только сапоги и штанины
  const cape = v.y < 0.47 && v.y > 0.2 && (v.z < -0.035 || Math.abs(v.x) > 0.15);
  for (let s = 0; s < segBones.length; s++) { const n = segBones[s], k = KIND(n), sd = SIDE(n);
    line.set(A[s], B[s]); line.closestPointToPoint(v, true, q); const d = q.distanceTo(v);
    if (k === 'leg') { if (cape || v.y > 0.45 || v.x * sd < -0.02 || d > (v.y < 0.235 ? 0.1 : 0.065)) continue; }
    if (k === 'arm') { const hand = /hand/.test(n); if (!hand && (v.x * sd < 0.105 || v.z < -0.05)) continue; if (d > (hand ? 0.05 : 0.06) || v.y < 0.4 && !hand) continue; }
    if (k === 'core' && n === 'head' && v.y < 0.7) continue;
    cand.push([s, d]); }
  if (!cand.length) cand.push([0, 1]);
  cand.sort((a, b) => a[1] - b[1]); const top = cand.slice(0, 4); let sum = 0; const ws = top.map(([s, d]) => { const w = 1 / Math.pow(d + 0.012, 4); sum += w; return w; });
  top.forEach(([s], k) => { SI[i * 4 + k] = boneIndex[segBones[s]]; SW[i * 4 + k] = ws[k] / sum; }); }
geo0.setAttribute('skinIndex', new T.Uint16BufferAttribute(SI, 4)); geo0.setAttribute('skinWeight', new T.Float32BufferAttribute(SW, 4));
log('weights ok');

const mesh = new T.SkinnedMesh(geo0, src.material); mesh.name = 'bogenbay_body';
const root = new T.Group(); root.name = 'Bogenbay'; root.add(bones.hips); root.add(mesh); root.updateMatrixWorld(true);
const skeleton = new T.Skeleton(names.map(n => bones[n])); mesh.bind(skeleton);

// ── 4. цикл ходьбы (1.2 c): локальные оси костей = мировые (кости без поворота) ──
const DUR = 1.3, NK = 48, times = [], tracks = {}, qa = new T.Quaternion(), e = new T.Euler();
const rot = (n, x, y = 0, z = 0) => { e.set(x, y, z, 'YXZ'); qa.setFromEuler(e); (tracks[n] ||= []).push(...qa.toArray()); };
const hipPos = [];
for (let k = 0; k <= NK; k++) { const t = k / NK * DUR, f = t / DUR * Math.PI * 2; times.push(t);
  for (const [s, ph] of [['L', 0], ['R', Math.PI]]) { const a = f + ph, thigh = -0.28 * Math.sin(a), swing = Math.max(0, Math.cos(a)), knee = 0.06 + 0.6 * Math.pow(swing, 1.4) + 0.08 * Math.max(0, -Math.sin(a));
    rot('thigh' + s, thigh); rot('shin' + s, knee); rot('foot' + s, -0.55 * (thigh + knee) + 0.25 * Math.max(0, Math.sin(a)) * 0.6); }
  const sL = Math.sin(f);
  rot('hips', 0, 0.09 * sL, 0.025 * Math.cos(f)); rot('spine', -0.02, -0.05 * sL, 0); rot('chest', 0.02, -0.06 * sL, -0.015 * Math.cos(f));
  rot('neck', 0.01, 0.04 * sL, 0); rot('head', -0.02, 0.03 * sL, 0);
  rot('armR', -0.13 * sL, 0, 0); rot('foreR', -0.04 - 0.08 * Math.max(0, sL), 0, 0); rot('handR', -0.03, 0, 0);   // свободная рука машет в такт противоположной ноге
  rot('armL', 0.04 * sL, 0, 0); rot('foreL', 0, 0, 0); rot('handL', 0, 0, 0);                                        // левая держит саблю — почти неподвижна
  hipPos.push(J.hips[0], J.hips[1] - 0.009 * Math.cos(2 * f) - 0.004, J.hips[2]); }
const clipTracks = Object.entries(tracks).map(([n, vals]) => new T.QuaternionKeyframeTrack(n + '.quaternion', times, vals));
clipTracks.push(new T.VectorKeyframeTrack('hips.position', times, hipPos));
const clip = new T.AnimationClip('walk', DUR, clipTracks);
log('clip tracks ' + clipTracks.length);

// предпросмотр-проверка: кадры в позе
window.__check = { root, clip, mesh };
const glb = await new GLTFExporter().parseAsync(root, { binary: true, animations: [clip], maxTextureSize: 2048 });
window.GLB = btoa(Array.from(new Uint8Array(glb), c => String.fromCharCode(c)).join(''));
window.OUT = { verts: nv, bones: names.length, bytes: glb.byteLength }; window.READY = true;
</script>
