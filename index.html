        // ═════════════════════════════════════════════════════════════════════
        //  3D: общие помощники (three.js r149, глобальный THREE)
        // ═════════════════════════════════════════════════════════════════════
        const GOLD3 = 0xC5A55A;

        // Сцена + камера + собственные orbit-контролы (мышь, колесо, тач)
        function createStage(container, { distance = 18, target = [0, 4, 0], minDist = 4, maxDist = 60, autoRotate = true, fog = true, panPrimary = false } = {}) {
            const T = window.THREE;
            const w = container.clientWidth || 800, h = container.clientHeight || 600;
            const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(w, h);
            renderer.outputEncoding = T.sRGBEncoding;
            container.appendChild(renderer.domElement);
            renderer.domElement.style.display = 'block';
            renderer.domElement.style.touchAction = 'none';

            const scene = new T.Scene();
            if (fog) scene.fog = new T.FogExp2(0x080808, 0.018);
            const camera = new T.PerspectiveCamera(45, w / h, 0.1, 500);

            scene.add(new T.AmbientLight(0xffffff, 0.45));
            const key = new T.DirectionalLight(0xfff1d0, 0.9); key.position.set(8, 14, 10); scene.add(key);
            const rim = new T.DirectionalLight(0xC5A55A, 0.5); rim.position.set(-10, 6, -8); scene.add(rim);

            // орбита: сферические координаты вокруг target
            const st = { theta: 0.6, phi: 1.15, dist: distance, dist0: distance, target: new T.Vector3(...target), auto: autoRotate, fly: null };
            if (w < 640) st.dist *= 1.5;
            const apply = () => {
                st.phi = Math.max(0.15, Math.min(Math.PI - 0.15, st.phi));
                st.dist = Math.max(minDist, Math.min(maxDist, st.dist));
                camera.position.set(
                    st.target.x + st.dist * Math.sin(st.phi) * Math.sin(st.theta),
                    st.target.y + st.dist * Math.cos(st.phi),
                    st.target.z + st.dist * Math.sin(st.phi) * Math.cos(st.theta));
                camera.lookAt(st.target);
            };
            apply();

            const el = renderer.domElement;
            const ptrs = new Map(); let pinch0 = 0, moved = 0, idle = 0;
            const down = e => { el.setPointerCapture?.(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, b: e.button, sh: e.shiftKey }); moved = 0; st.fly = null; idle = 0;
                if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); } };
            const move = e => {
                const p = ptrs.get(e.pointerId); if (!p) return;
                const dx = e.clientX - p.x, dy = e.clientY - p.y; moved += Math.abs(dx) + Math.abs(dy);
                if (ptrs.size === 2) {
                    p.x = e.clientX; p.y = e.clientY;
                    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
                    if (pinch0) st.dist *= pinch0 / d; pinch0 = d; apply(); return;
                }
                p.x = e.clientX; p.y = e.clientY;
                if ((p.b === 2 || p.sh) !== panPrimary) { // панорама
                    const k = st.dist * 0.0016;
                    const right = new T.Vector3().setFromMatrixColumn(camera.matrix, 0);
                    st.target.addScaledVector(right, -dx * k); st.target.y += dy * k;
                } else { st.theta -= dx * 0.006; st.phi -= dy * 0.006; }
                apply();
            };
            const up = e => { ptrs.delete(e.pointerId); pinch0 = 0; };
            const wheel = e => { e.preventDefault(); st.fly = null; st.dist *= Math.exp(e.deltaY * 0.0012); apply(); };
            el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move);
            el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
            el.addEventListener('wheel', wheel, { passive: false });
            el.addEventListener('contextmenu', e => e.preventDefault());

            const frameCbs = [];
            let raf = 0, last = performance.now(), alive = true;
            const loop = (now) => {
                if (!alive) return;
                const dt = Math.min(0.05, (now - last) / 1000); last = now; idle += dt;
                if (st.fly) { // плавный перелёт камеры
                    const f = st.fly; f.t = Math.min(1, f.t + dt / f.dur); const k = 1 - Math.pow(1 - f.t, 3);
                    st.target.lerpVectors(f.from, f.to, k); st.dist = f.d0 + (f.d1 - f.d0) * k;
                    if (f.t >= 1) st.fly = null;
                }
                if (st.auto && ptrs.size === 0 && idle > 2.5) st.theta += dt * 0.12;
                apply();
                frameCbs.forEach(cb => cb(dt, now / 1000));
                renderer.render(scene, camera);
                raf = requestAnimationFrame(loop);
            };
            raf = requestAnimationFrame(loop);

            const ro = new ResizeObserver(() => {
                const W = container.clientWidth, H = container.clientHeight; if (!W || !H) return;
                camera.aspect = W / H; camera.updateProjectionMatrix(); renderer.setSize(W, H);
            });
            ro.observe(container);

            const ray = new T.Raycaster(); const ndc = new T.Vector2();
            const pick = (e, objects) => {
                const r = el.getBoundingClientRect();
                ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
                ray.setFromCamera(ndc, camera);
                return ray.intersectObjects(objects, true)[0] || null;
            };
            // клик = отпускание без заметного перетаскивания
            const onClick = (cb) => el.addEventListener('pointerup', e => { if (moved < 6) cb(e); });

            return {
                T, scene, camera, renderer, el, st, pick, onClick,
                onFrame: cb => frameCbs.push(cb),
                flyTo: (pos, d1 = st.dist, dur = 1.2) => { st.fly = { from: st.target.clone(), to: pos.clone(), d0: st.dist, d1, t: 0, dur }; idle = 0; },
                setAuto: v => { st.auto = v; },
                dispose: () => {
                    alive = false; cancelAnimationFrame(raf); ro.disconnect();
                    scene.traverse(o => { o.geometry?.dispose?.(); const m = o.material; (Array.isArray(m) ? m : m ? [m] : []).forEach(mm => { mm.map?.dispose?.(); mm.dispose?.(); }); });
                    renderer.dispose(); el.remove();
                },
            };
        }

        // Текстовый спрайт (подпись в сцене)
        function makeTextSprite(T, text, { size = 0.5, color = '#E8D5A0', bg = null, weight = 600, font = 'Inter, sans-serif', res = 1 } = {}) {
            const c = document.createElement('canvas'); const g = c.getContext('2d');
            const fs = Math.round(64 * res); g.font = `${weight} ${fs}px ${font}`;
            const tw = Math.ceil(g.measureText(text).width) + 40 * res;
            c.width = tw; c.height = fs + Math.round(36 * res);
            g.font = `${weight} ${fs}px ${font}`; g.textAlign = 'center'; g.textBaseline = 'middle';
            if (bg) { g.fillStyle = bg; const r = (fs + 36 * res) / 2 - 2; g.beginPath(); g.roundRect ? g.roundRect(2, 2, c.width - 4, c.height - 4, r) : g.rect(2, 2, c.width - 4, c.height - 4); g.fill(); }
            g.shadowColor = 'rgba(0,0,0,0.9)'; g.shadowBlur = 10;
            g.fillStyle = color; g.fillText(text, c.width / 2, c.height / 2 + 2);
            const tex = new T.CanvasTexture(c); tex.encoding = T.sRGBEncoding; tex.anisotropy = 8; tex.minFilter = T.LinearMipmapLinearFilter; tex.generateMipmaps = true;
            const mat = new T.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
            const s = new T.Sprite(mat); s.scale.set(size * c.width / c.height, size, 1);
            return s;
        }

        // Мягкая светящаяся точка (для ореола узлов)
        let _glowTex = null;
        function glowTexture(T) {
            if (_glowTex) return _glowTex;
            const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
            const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
            gr.addColorStop(0, 'rgba(255,230,160,1)'); gr.addColorStop(0.25, 'rgba(197,165,90,0.6)'); gr.addColorStop(1, 'rgba(197,165,90,0)');
            g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
            _glowTex = new T.CanvasTexture(c); return _glowTex;
        }

        function addStarDust(T, scene, n = 900, R = 60) {
            const pos = new Float32Array(n * 3);
            for (let i = 0; i < n; i++) {
                const r = R * Math.cbrt(Math.random()), th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
                pos[i * 3] = r * Math.sin(ph) * Math.cos(th); pos[i * 3 + 1] = r * Math.cos(ph) * 0.6 + 10; pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
            }
            const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(pos, 3));
            const p = new T.Points(g, new T.PointsMaterial({ color: GOLD3, size: 0.08, transparent: true, opacity: 0.55, depthWrite: false }));
            scene.add(p); return p;
        }

        // Золотое орнаментальное кольцо на «земле»
        function addGroundOrnament(T, scene, y = -0.6, R = 9) {
            const grp = new T.Group();
            [R, R * 0.78, R * 0.5].forEach((r, i) => {
                const m = new T.Mesh(new T.RingGeometry(r - 0.03, r, 128), new T.MeshBasicMaterial({ color: GOLD3, transparent: true, opacity: 0.35 - i * 0.08, side: T.DoubleSide }));
                m.rotation.x = -Math.PI / 2; grp.add(m);
            });
            // «қошқар мүйіз» — завитки по кругу
            const N = 16, pts = [];
            for (let k = 0; k < N; k++) {
                const a0 = (k / N) * Math.PI * 2;
                for (let s = 0; s <= 24; s++) {
                    const t = s / 24, sp = 0.55 * (1 - t);
                    const a = a0 + t * (Math.PI * 2 / N) * 0.9;
                    const rr = R * 0.89 + Math.sin(t * Math.PI) * 0.0 + sp * Math.cos(t * 9);
                    pts.push(new T.Vector3(Math.cos(a) * rr, 0, Math.sin(a) * rr));
                }
            }
            const lg = new T.BufferGeometry().setFromPoints(pts);
            grp.add(new T.Line(lg, new T.LineBasicMaterial({ color: GOLD3, transparent: true, opacity: 0.25 })));
            grp.position.y = y; scene.add(grp); return grp;
        }

        // Анатомические выноски: HTML-подписи по бокам + SVG-линии к точкам 3D
        function useLeaders() {
            const svgRef = useRef(null), boxRef = useRef(null);
            const update = (stage, items, activeId) => {
                const svg = svgRef.current, box = boxRef.current; if (!svg || !box) return;
                const W = box.clientWidth, H = box.clientHeight; const T = stage.T;
                const pr = items.map(it => {
                    const v = it.anchor().clone().project(stage.camera);
                    return { it, x: (v.x * 0.5 + 0.5) * W, y: (-v.y * 0.5 + 0.5) * H, vis: v.z < 1 };
                });
                const narrow = W < 640;
                const left = [], right = [];
                pr.forEach(p => (p.x < W / 2 ? left : right).push(p));
                const place = (arr, side) => {
                    arr.sort((a, b) => a.y - b.y);
                    const gap = narrow ? 26 : 34, top = Math.min(140, H * 0.17), bottom = H - 30;
                    let y = top;
                    arr.forEach(p => { p.ly = Math.max(y, Math.min(bottom, p.y)); y = p.ly + gap; });
                    // если вылезли вниз — сдвигаем вверх
                    for (let i = arr.length - 1, lim = bottom; i >= 0; i--) { if (arr[i].ly > lim) arr[i].ly = lim; lim = arr[i].ly - gap; }
                    arr.forEach(p => { p.side = side; p.lx = side === 'L' ? (narrow ? 8 : 24) : W - (narrow ? 8 : 24); });
                };
                place(left, 'L'); place(right, 'R');
                let html = '';
                pr.forEach(p => {
                    const el = p.it.el; if (!el) return;
                    el.style.top = (p.ly - 12) + 'px';
                    if (p.side === 'L') { el.style.left = p.lx + 'px'; el.style.right = 'auto'; el.style.textAlign = 'left'; }
                    else { el.style.right = (W - p.lx) + 'px'; el.style.left = 'auto'; el.style.textAlign = 'right'; }
                    el.style.opacity = p.vis ? 1 : 0;
                    const lw = el.offsetWidth;
                    const ex = p.side === 'L' ? p.lx + lw + 6 : p.lx - lw - 6;
                    const on = p.it.id === activeId;
                    const col = on ? '#F0D882' : 'rgba(197,165,90,0.55)';
                    if (p.vis) html += `<polyline points="${ex},${p.ly} ${ex + (p.side === 'L' ? 18 : -18)},${p.ly} ${p.x},${p.y}" fill="none" stroke="${col}" stroke-width="${on ? 1.6 : 0.8}"/><circle cx="${p.x}" cy="${p.y}" r="${on ? 4 : 2.5}" fill="${col}"/>`;
                });
                svg.innerHTML = html;
            };
            return { svgRef, boxRef, update };
        }

        // Хук: ждём THREE (CDN) и монтируем сцену
        function useThree(mountRef, build, deps = []) {
            const [err, setErr] = useState(null);
            useEffect(() => {
                let stage = null, cancelled = false, cleanup = null;
                const start = () => {
                    if (cancelled || !mountRef.current) return;
                    if (!window.THREE) { setErr('3D-кітапхана жүктелмеді · Не удалось загрузить three.js'); return; }
                    try { stage = createStage(mountRef.current, build.opts || {}); cleanup = build.run(stage); }
                    catch (e) { console.error(e); setErr('WebGL қолжетімсіз · WebGL недоступен в этом браузере'); }
                };
                if (window.THREE) start(); else { const t = setTimeout(start, 1500); return () => { cancelled = true; clearTimeout(t); }; }
                return () => { cancelled = true; cleanup?.(); stage?.dispose(); };
            }, deps);
            return err;
        }

        const btn3d = "b3d px-4 py-2 rounded-full text-[10px] tracking-widest uppercase border transition-all whitespace-nowrap shrink-0";
        const btnStyle = (on) => ({ borderColor: on ? '#C5A55A' : '#2a2a2a', color: on ? '#000' : '#C5A55A', background: on ? 'linear-gradient(135deg,#C5A55A,#8B6914)' : 'rgba(8,8,8,0.7)', backdropFilter: 'blur(6px)' });

        // ═════════════════════════════════════════════════════════════════════
        //  3D ШЕЖІРЕ — Бәйтерек
        // ═════════════════════════════════════════════════════════════════════
        // ── Спиральное шежіре: Алаш в центре, поколения — витки спирали, узлы раскрываются по клику ──
        const SP = { R: 2.9, POW: 0.82, TWIST: 0.23, DY: 0.85 };
        const spiralRadius = d => d === 0 ? 0 : SP.R * Math.pow(d, SP.POW) + 1.2;
        function buildTreeRecs(root) {
            const all = [], byId = {};
            const walk = (n, parent, depth) => { const r = { n, parent, depth, kids: [], path: parent ? [...parent.path, n] : [n] }; all.push(r); byId[n.id] = r; if (parent) parent.kids.push(r); (n.children || []).forEach(c => walk(c, r, depth + 1)); return r; };
            walk(root, null, 0); return { all, byId, root: all[0] };
        }
        const countDesc = r => r.nd != null ? r.nd : (r.nd = r.kids.reduce((s, k) => s + 1 + countDesc(k), 0));

        function Tree3DScreen({ onBack, onClassic }) {
            const mountRef = useRef(null);
            const stageRef = useRef(null);
            const api = useRef({});
            const [sel, setSel] = useState(null);
            const [hover, setHover] = useState(null);
            const [auto, setAuto] = useState(false);
            const [labels, setLabels] = useState(true);
            const [q, setQ] = useState('');
            const me = (() => { try { return localStorage.getItem('shejire_user'); } catch { return null; } })();

            const err = useThree(mountRef, {
                opts: { distance: 46, target: [0, -6, 0], maxDist: 170, minDist: 3, autoRotate: false, fog: false },
                run: (S) => {
                    const { T, scene } = S; stageRef.current = S; S.st.theta = 0.35; S.st.phi = 0.78;
                    addStarDust(T, scene, 1400, 110);
                    const { all, byId, root } = buildTreeRecs(TREE_DATA);
                    const glow = glowTexture(T), sphG = new T.SphereGeometry(1, 32, 20);
                    const expanded = new Set([root.n.id, ...root.kids.map(k => k.n.id)]);
                    const meRec = me && byId[me];
                    if (meRec) meRec.path.forEach(n => expanded.add(n.id));
                    let pickables = [], ringsGroup = new T.Group(); scene.add(ringsGroup);

                    // ── объекты узла создаются по требованию ──
                    const makeNode = (r) => {
                        const n = r.n, imp = n.isMainLine || n.highlight || r.depth <= 2;
                        const rad = r.depth === 0 ? 0.75 : n.highlight ? 0.36 : imp ? 0.3 : 0.22;
                        const col = n.highlight ? 0xF0D882 : imp ? GOLD3 : n.more ? 0x38bda8 : 0xa58f5e;
                        const g = new T.Group(); scene.add(g); r.g = g; r.rad = rad;
                        const m = new T.Mesh(sphG, new T.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: n.highlight ? 0.45 : 0.22, roughness: 0.3, metalness: 0.65 }));
                        m.scale.setScalar(rad); m.userData.rec = r; g.add(m); r.mesh = m;
                        const ring = new T.Mesh(new T.TorusGeometry(rad * 1.4, rad * 0.08, 8, 40), new T.MeshBasicMaterial({ color: n.highlight ? 0xFFF3C4 : 0xC5A55A, transparent: true, opacity: imp ? 0.85 : 0.5 }));
                        ring.rotation.x = Math.PI / 2; g.add(ring); r.ring = ring;
                        const gl = new T.Sprite(new T.SpriteMaterial({ map: glow, transparent: true, depthWrite: false, blending: T.AdditiveBlending, opacity: n.highlight ? 0.6 : imp ? 0.35 : 0.18 }));
                        gl.scale.setScalar(rad * 5); g.add(gl); r.glow = gl;
                        const s = makeTextSprite(T, n.name + (n.more ? ' ↗' : ''), { size: r.depth === 0 ? 1.15 : imp ? 0.62 : 0.5, color: n.highlight ? '#FFF3C4' : imp ? '#F2E6C4' : n.more ? '#5eead4' : '#d6c59a', weight: imp ? 700 : 600, bg: 'rgba(10,8,4,0.8)', res: 2 });
                        s.position.set(0, rad + 0.62, 0); s.userData.rec = r; g.add(s); r.label = s;
                        if (n.label) { const l2 = makeTextSprite(T, n.label, { size: 0.32, color: '#C5A55A', res: 1.6 }); l2.position.set(0, rad + 1.15, 0); g.add(l2); }
                        // ағайындар — маленькие зелёные «листья» вокруг
                        const sib = (n.siblings || []).filter(x => x !== n.name).slice(0, 6); r.sibLabels = [];
                        sib.forEach((sb, i) => { const a = (i / sib.length) * Math.PI * 2 + 0.4; const p = new T.Vector3(Math.cos(a) * (rad + 0.9), -0.35, Math.sin(a) * (rad + 0.9));
                            const leaf = new T.Mesh(sphG, new T.MeshStandardMaterial({ color: 0x5f9a6a, emissive: 0x1d3b22, roughness: 0.5 })); leaf.scale.setScalar(0.1); leaf.position.copy(p); g.add(leaf);
                            g.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(), p]), new T.LineBasicMaterial({ color: 0x5f9a6a, transparent: true, opacity: 0.4 })));
                            const sl = makeTextSprite(T, sb, { size: 0.26, color: '#8fc49a', weight: 500, res: 1.6 }); sl.position.copy(p).add(new T.Vector3(0, -0.3, 0)); g.add(sl); r.sibLabels.push(sl); });
                        // значок «+N» для свёрнутых
                        const nd = countDesc(r);
                        if (nd) { const b = makeTextSprite(T, `+${nd}`, { size: 0.36, color: '#000', bg: 'rgba(240,216,130,0.95)', weight: 700, res: 1.6 }); b.position.set(rad + 0.55, rad * 0.3, 0); b.userData.rec = r; g.add(b); r.badge = b; }
                        r.cur = r.parent?.cur ? r.parent.cur.clone() : new T.Vector3(); r.tgt = r.cur.clone(); g.position.copy(r.cur);
                    };
                    // ── рёбра: дуга по спирали между полярными координатами ──
                    const edgeMat = (main) => new T.MeshStandardMaterial({ color: main ? 0xC5A55A : 0x8a7444, emissive: main ? 0x4a3608 : 0x1a1408, roughness: 0.4, metalness: 0.6 });
                    const polar = v => ({ a: Math.atan2(v.z, v.x), r: Math.hypot(v.x, v.z), y: v.y });
                    const rebuildEdge = (r) => {
                        if (!r.parent) return; const A = polar(r.parent.cur), B = polar(r.cur);
                        let da = B.a - A.a; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
                        const a0 = A.r < 0.01 ? B.a : A.a, pts = [];
                        for (let i = 0; i <= 20; i++) { const t = i / 20, e = t * t * (3 - 2 * t);
                            const a = A.r < 0.01 ? B.a : a0 + da * e, rr = A.r + (B.r - A.r) * t, y = A.y + (B.y - A.y) * e;
                            pts.push(new T.Vector3(Math.cos(a) * rr, y, Math.sin(a) * rr)); }
                        const main = (r.n.isMainLine || r.n.highlight) && (r.parent.n.isMainLine || r.parent.depth === 0);
                        const geo = new T.TubeGeometry(new T.CatmullRomCurve3(pts), 24, main ? 0.075 : 0.04, 7, false);
                        if (!r.edge) { r.edge = new T.Mesh(geo, edgeMat(main)); r.edge.userData.main = main; scene.add(r.edge); } else { r.edge.geometry.dispose(); r.edge.geometry = geo; }
                    };

                    // ── раскладка видимого дерева ──
                    let visible = [], animT = 0;
                    const layout = () => {
                        visible = []; const leaves = [];
                        const walk = (r) => { visible.push(r); const open = expanded.has(r.n.id) && r.kids.length; r.open = open; if (open) r.kids.forEach(walk); else leaves.push(r); };
                        walk(root);
                        let cur = 0; const total = Math.max(1, leaves.length);
                        const slot = (r) => { if (!r.open) { r.slot = cur + 0.5; cur += 1; return r.slot; } const sl = r.kids.map(slot); r.slot = (sl[0] + sl[sl.length - 1]) / 2; return r.slot; };
                        slot(root);
                        visible.forEach(r => { if (!r.g) makeNode(r);
                            const a = (r.slot / total) * Math.PI * 2 + r.depth * SP.TWIST, rr = spiralRadius(r.depth);
                            r.tgt = new T.Vector3(Math.cos(a) * rr, -r.depth * SP.DY, Math.sin(a) * rr);
                            r.g.visible = true; if (r.edge) r.edge.visible = true;
                            if (r.badge) r.badge.visible = !r.open; });
                        const vis = new Set(visible);
                        all.forEach(r => { if (r.g && !vis.has(r)) { r.hiding = true; } else r.hiding = false; });
                        pickables = visible.flatMap(r => [r.mesh, r.label, r.badge].filter(Boolean));
                        // кольца-«орбиты» поколений
                        ringsGroup.children.slice().forEach(c => { c.geometry.dispose(); ringsGroup.remove(c); });
                        const depths = [...new Set(visible.map(r => r.depth))].filter(d => d > 0);
                        depths.forEach(d => { const rr = spiralRadius(d); const m = new T.Mesh(new T.RingGeometry(rr - 0.02, rr + 0.02, 160), new T.MeshBasicMaterial({ color: 0xC5A55A, transparent: true, opacity: d % 7 === 0 ? 0.22 : 0.07, side: T.DoubleSide, depthWrite: false }));
                            m.rotation.x = -Math.PI / 2; m.position.y = -d * SP.DY; ringsGroup.add(m); });
                        animT = 1.2;
                    };
                    const fit = (fly = true) => { let R = 4, ymin = 0; visible.forEach(r => { R = Math.max(R, Math.hypot(r.tgt.x, r.tgt.z)); ymin = Math.min(ymin, r.tgt.y); });
                        const c = new T.Vector3(0, ymin / 2, 0), d = Math.min(165, (R * 2 + 6) / (2 * Math.tan(S.camera.fov * Math.PI / 360) * Math.min(1, S.camera.aspect)) * 0.95);
                        if (fly) S.flyTo(c, d); else { S.st.target.copy(c); S.st.dist = d; } };
                    layout();
                    visible.forEach(r => { r.cur.copy(r.tgt); r.g.position.copy(r.cur); rebuildEdge(r); });
                    fit(false);

                    // ── кадр: анимация разлёта, подписи, пульс ──
                    const tmp = new T.Vector3();
                    S.onFrame((dt, t) => {
                        if (animT > 0) { animT -= dt; const k = Math.min(1, dt * 5);
                            all.forEach(r => { if (!r.g) return;
                                if (r.hiding) { const p = r.parent; let anc = p; while (anc && anc.hiding) anc = anc.parent; r.cur.lerp(anc ? anc.cur : new T.Vector3(), k); if (animT <= 0.1 || r.cur.distanceTo(anc ? anc.cur : tmp.set(0, 0, 0)) < 0.2) { r.g.visible = false; if (r.edge) r.edge.visible = false; } }
                                else r.cur.lerp(r.tgt, k);
                                r.g.position.copy(r.cur); });
                            all.forEach(r => { if (r.g && r.g.visible && r.parent) rebuildEdge(r); });
                        }
                        const lab = api.current.labels !== false;
                        visible.forEach(r => { const d = tmp.copy(r.cur).distanceTo(S.camera.position);
                            r.label.material.opacity = lab ? Math.max(0.25, Math.min(1, (110 - d) / 40)) : 0;
                            r.sibLabels.forEach(s => s.material.opacity = lab ? Math.max(0, Math.min(0.9, (24 - d) / 8)) : 0);
                            if (r.n.highlight) r.glow.scale.setScalar(r.rad * 5 * (1 + Math.sin(t * 2.4 + r.depth) * 0.15));
                            r.ring.rotation.z = t * 0.3; });
                    });

                    const highlightPath = (rec) => {
                        all.forEach(r => { if (r.edge) r.edge.material.emissive.setHex(r.edge.userData.main ? 0x4a3608 : 0x1a1408); if (r.mesh) r.mesh.material.emissiveIntensity = r.n.highlight ? 0.45 : 0.22; });
                        if (!rec) return;
                        rec.path.forEach(n => { const r = byId[n.id]; if (r?.edge) r.edge.material.emissive.setHex(0xF0D882); if (r?.mesh) r.mesh.material.emissiveIntensity = 0.8; });
                    };
                    const select = (rec, fly = true) => {
                        highlightPath(rec);
                        setSel(rec ? { id: rec.n.id, name: rec.n.name, era: rec.n.era, label: rec.n.label, gen: rec.n.gen, siblings: rec.n.siblings || [], kids: rec.kids.map(c => c.n.name), kidIds: rec.kids.map(c => c.n.id), open: expanded.has(rec.n.id), nd: countDesc(rec), path: rec.path.map(p => p.name), pathIds: rec.path.map(p => p.id) } : null);
                        if (rec && fly) setTimeout(() => S.flyTo(rec.tgt.clone(), Math.max(14, Math.min(S.st.dist, 26))), 60);
                    };
                    const toggle = (rec) => { if (!rec.kids.length) return select(rec);
                        if (expanded.has(rec.n.id) && rec !== root) { const close = r => { expanded.delete(r.n.id); r.kids.forEach(close); }; close(rec); } else expanded.add(rec.n.id);
                        layout(); select(rec); };
                    const openPath = (rec) => { rec.path.slice(0, -1).forEach(n => expanded.add(n.id)); layout(); select(rec); };
                    S.onClick(e => { const h = S.pick(e, pickables); if (h) toggle(h.object.userData.rec); else select(null, false); });
                    S.el.addEventListener('pointermove', e => { if (e.buttons) return;
                        const h = S.pick(e, pickables); S.el.style.cursor = h ? 'pointer' : 'grab';
                        setHover(h ? { name: h.object.userData.rec.n.name + (h.object.userData.rec.kids.length ? (expanded.has(h.object.userData.rec.n.id) ? '  ⊖' : `  ⊕ ${countDesc(h.object.userData.rec)}`) : ''), x: e.offsetX, y: e.offsetY } : null); });
                    api.current.find = (txt) => { const s = txt.trim().toLowerCase(); if (!s) return false;
                        const r = all.find(r => r.n.name.toLowerCase() === s) || all.find(r => r.n.name.toLowerCase().includes(s)); if (r) openPath(r); return !!r; };
                    api.current.byId = (id) => { const r = byId[id]; if (r) openPath(r); return !!r; };
                    api.current.toggleId = (id) => { const r = byId[id]; if (r) toggle(r); };
                    api.current.openId = (id) => { const r = byId[id]; if (r) { if (!expanded.has(id)) expanded.add(id); openPath(r); } };
                    api.current.expandAll = () => { const q = [root]; let n = 0; while (q.length && n < 1500) { const r = q.shift(); expanded.add(r.n.id); n += 1 + r.kids.length; r.kids.forEach(k => q.push(k)); } layout(); select(null, false); fit(); };
                    api.current.collapse = () => { expanded.clear(); expanded.add(root.n.id); root.kids.forEach(k => expanded.add(k.n.id)); layout(); select(null, false); fit(); };
                    api.current.reset = () => { select(null, false); S.st.theta = 0.35; S.st.phi = 0.78; fit(); };
                    if (meRec) setTimeout(() => highlightPath(meRec), 300);
                },
            }, []);

            useEffect(() => { stageRef.current?.setAuto(auto); }, [auto]);
            useEffect(() => { api.current.labels = labels; }, [labels]);

            return (
                <div className="fixed inset-0 z-40 keep-dark" style={{ background: 'radial-gradient(ellipse at 50% 80%, #17130a 0%, #080808 60%)' }}>
                    <div ref={mountRef} className="absolute inset-0" />
                    {err && <div className="absolute inset-0 flex items-center justify-center text-[#C5A55A] text-sm p-8 text-center">{err}</div>}

                    {/* верх */}
                    <div className="absolute top-0 inset-x-0 p-4 md:p-6 flex flex-wrap items-start justify-between gap-3 pointer-events-none">
                        <div className="pointer-events-auto">
                            <button onClick={onBack} className="text-[#666] hover:text-[#C5A55A] text-[10px] tracking-widest uppercase mb-3 block">← Назад</button>
                            <p className="text-[#C5A55A] text-[9px] tracking-[0.5em] uppercase">3D · БӘЙТЕРЕК</p>
                            <h2 className="text-3xl md:text-5xl font-serif text-white">Шежіре ағашы</h2>
                            <p className="text-[#666] text-[11px] mt-1 max-w-xs">Алаштан бүгінге дейін — спираль бойымен. Есімді басыңыз — ұрпақтары ашылады. Тартып айналдырыңыз, дөңгелекпен жақындатыңыз, Shift — жылжыту.</p>
                        </div>
                        <div className="pointer-events-auto flex flex-col items-end gap-2 mr-40">
                            <form onSubmit={e => { e.preventDefault(); if (!api.current.find?.(q)) setHover({ name: 'Табылмады · Не найдено', x: 20, y: 120 }); }} className="flex gap-2">
                                <input value={q} onChange={e => setQ(e.target.value)} placeholder="Атын іздеу · Поиск"
                                    className="bg-[#0d0d0dcc] border border-[#2a2a2a] focus:border-[#C5A55A] rounded-full px-4 py-2 text-xs text-white outline-none w-44" />
                                <button className={btn3d} style={btnStyle(false)}>⌕</button>
                            </form>
                            <div className="flex flex-wrap justify-end gap-2">
                                {me && <button className={btn3d} style={btnStyle(false)} onClick={() => api.current.byId?.(me)}>👤 Мен</button>}
                                <button className={btn3d} style={btnStyle(auto)} onClick={() => setAuto(a => !a)}>⟳ Айналу</button>
                                <button className={btn3d} style={btnStyle(labels)} onClick={() => setLabels(l => !l)}>Aa Атаулар</button>
                                <button className={btn3d} style={btnStyle(false)} onClick={() => api.current.expandAll?.()}>⊕ Барлығын ашу</button>
                                <button className={btn3d} style={btnStyle(false)} onClick={() => api.current.collapse?.()}>⊖ Жинау</button>
                                <button className={btn3d} style={btnStyle(false)} onClick={() => api.current.reset?.()}>⌂ Басы</button>
                                <button className={btn3d} style={btnStyle(false)} onClick={onClassic}>▤ 2D</button>
                            </div>
                        </div>
                    </div>

                    {hover && !sel && <div className="absolute pointer-events-none px-3 py-1 rounded-full text-[11px] text-black font-semibold"
                        style={{ left: hover.x + 14, top: hover.y + 14, background: '#C5A55A' }}>{hover.name}</div>}

                    {/* легенда */}
                    <div className={`absolute bottom-4 right-4 text-[10px] text-[#777] space-y-1 bg-[#080808aa] rounded-xl p-3 backdrop-blur ${sel ? "hidden" : "hidden sm:block"}`}>
                        <p><span className="inline-block w-2.5 h-2.5 rounded-full mr-2 align-middle" style={{ background: '#F0D882', boxShadow: '0 0 8px #F0D882' }} />Ұрпақ · потомки</p>
                        <p><span className="inline-block w-2.5 h-2.5 rounded-full mr-2 align-middle" style={{ background: '#C5A55A' }} />Негізгі тармақ · главная линия</p>
                        <p><span className="inline-block w-2.5 h-2.5 rounded-full mr-2 align-middle" style={{ background: '#7a6a45' }} />Басқа рулар · другие роды</p>
                        <p><span className="inline-block w-2.5 h-2.5 rounded-full mr-2 align-middle" style={{ background: '#3d6b45' }} />Ағайындар · братья предков</p>
                        <p><span className="inline-block w-2.5 h-2.5 rounded-full mr-2 align-middle" style={{ background: '#38bda8', boxShadow: '0 0 8px #38bda8' }} />Жалғасы бар · есть продолжение</p>
                    </div>

                    {/* карточка выбранного */}
                    {sel && (
                        <div className="absolute right-4 bottom-24 w-[min(360px,calc(100vw-32px))] rounded-2xl p-px" style={{ background: 'linear-gradient(135deg,rgba(197,165,90,0.5),rgba(139,105,20,0.1))' }}>
                            <div className="rounded-2xl p-5 max-h-[55vh] overflow-y-auto" style={{ background: 'rgba(10,10,10,0.94)', backdropFilter: 'blur(10px)' }}>
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-[#C5A55A] text-[9px] tracking-[0.4em] uppercase">{sel.gen ? `${sel.gen}-ұрпақ` : 'Түп ата'}</p>
                                        <h3 className="text-2xl font-serif text-white">{sel.name}</h3>
                                        {sel.label && <p className="text-[#C5A55A] text-xs">{sel.label}</p>}
                                        {sel.era && <p className="text-[#888] text-xs mt-1 italic">{sel.era}</p>}
                                    </div>

        // ── 2D шежіре списком (как на tumalas.kz): все имена, раскрытие, поиск, виртуальная прокрутка ──
        const ROW_H = 34;
        const OL_IND = () => (innerWidth < 640 ? 11 : 22);
        function ShejireOutline({ onBack, on3D }) {
            const idx = useMemo(() => {
                const parent = {}, list = [], byId = {};
                const walk = (n, p, d) => { parent[n.id] = p; byId[n.id] = n; list.push({ n, d, key: normName(n.name) }); (n.children || []).forEach(c => walk(c, n, d + 1)); };
                walk(TREE_DATA, null, 0); return { parent, list, byId };
            }, []);
            const me = (() => { try { return localStorage.getItem('shejire_user'); } catch { return null; } })();
            const pathIds = (id) => { const out = []; let n = idx.byId[id]; while (n) { out.unshift(n.id); n = idx.parent[n.id]; } return out; };
            const [expanded, setExpanded] = useState(() => { const s = new Set(['alash']); const mainOpen = n => { if (n.isMainLine || n.id === 'alash') { s.add(n.id); (n.children || []).forEach(mainOpen); } }; mainOpen(TREE_DATA);
                TREE_DATA.children.forEach(z => s.add(z.id)); return s; });
            const [sel, setSel] = useState(me && idx.byId[me] ? me : null);
            const [q, setQ] = useState(''); const [hit, setHit] = useState(0);
            const [scroll, setScroll] = useState(0); const [vh, setVh] = useState(600);
            const box = useRef(null);
            const rows = useMemo(() => { const out = []; const walk = (n, d) => { out.push({ n, d }); if (expanded.has(n.id)) (n.children || []).forEach(c => walk(c, d + 1)); }; walk(TREE_DATA, 0); return out; }, [expanded]);
            const matches = useMemo(() => { const s = normName(q); if (s.length < 2) return []; return idx.list.filter(x => x.key.includes(s)).map(x => x.n.id); }, [q]);
            const mainSet = useMemo(() => new Set(me && idx.byId[me] ? pathIds(me) : []), []);
            const selPath = sel ? pathIds(sel) : [];
            useEffect(() => { const el = box.current; if (!el) return; const r = () => setVh(el.clientHeight); r(); addEventListener('resize', r); return () => removeEventListener('resize', r); }, []);
            const scrollTo = (id, ex) => { const rr = ex ? rowsFor(ex) : rows, i = rr.findIndex(r => r.n.id === id); if (i >= 0 && box.current) box.current.scrollTo({ top: Math.max(0, i * ROW_H - vh / 3), left: Math.max(0, rr[i].d * OL_IND() - 60), behavior: 'smooth' }); };
            const rowsFor = (ex) => { const out = []; const walk = (n, d) => { out.push({ n, d }); if (ex.has(n.id)) (n.children || []).forEach(c => walk(c, d + 1)); }; walk(TREE_DATA, 0); return out; };
            const reveal = (id) => { const ex = new Set(expanded); pathIds(id).slice(0, -1).forEach(x => ex.add(x)); setExpanded(ex); setSel(id); setTimeout(() => scrollTo(id, ex), 30); };
            const toggle = (n) => { setSel(n.id); if (!n.children?.length) return; setExpanded(prev => { const s = new Set(prev); if (s.has(n.id)) { const close = x => { s.delete(x.id); (x.children || []).forEach(close); }; close(n); } else s.add(n.id); return s; }); };
            const openAll = () => setExpanded(new Set(idx.list.filter(x => x.n.children?.length).map(x => x.n.id)));
            const openBranch = (id) => { const s = new Set(expanded); const walk = n => { if (n.children?.length) { s.add(n.id); n.children.forEach(walk); } }; walk(idx.byId[id]); setExpanded(s); };
            const goHit = (k) => { if (!matches.length) return; const i = ((k % matches.length) + matches.length) % matches.length; setHit(i); reveal(matches[i]); };
            const countAll = n => (n.children || []).reduce((s, c) => s + 1 + countAll(c), 0);
            const descCache = useMemo(() => { const m = {}; const f = n => (m[n.id] = (n.children || []).reduce((s, c) => s + 1 + f(c), 0)); f(TREE_DATA); return m; }, []);
            const first = Math.max(0, Math.floor(scroll / ROW_H) - 15), last = Math.min(rows.length, Math.ceil((scroll + vh) / ROW_H) + 15);
            const selN = sel && idx.byId[sel];
            const matchSet = useMemo(() => new Set(matches), [matches]);
            return (
                <div className="ol-root fixed inset-0 z-40 flex flex-col" style={{ background: '#0a0906' }}>
                    <div className="ol-head p-3 md:p-5 border-b border-[#2a2418] space-y-3" style={{ background: 'rgba(12,10,6,.96)' }}>

                                <button onClick={onBack} className="text-[#777] hover:text-[#C5A55A] text-[10px] tracking-widest uppercase">← Назад</button>
                                <h2 className="text-2xl md:text-3xl font-serif text-[#F0D882]">Шежіре · тізім</h2>
                                <span className="text-[#777] text-xs">{idx.list.length.toLocaleString('ru-RU')} есім · ашық {rows.length.toLocaleString('ru-RU')}</span>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-2 items-center">
                            <div className="flex items-center gap-1 rounded-full border border-[#2a2a2a] focus-within:border-[#C5A55A] bg-[#0d0d0d] pl-4 pr-1">
                                <input value={q} onChange={e => { setQ(e.target.value); setHit(0); }} onKeyDown={e => { if (e.key === 'Enter') goHit(e.shiftKey ? hit - 1 : (matches[hit] === sel ? hit + 1 : hit)); }}
                                    placeholder="Есім іздеу · поиск по 28 644 именам" className="bg-transparent outline-none text-sm text-white py-2 w-56 md:w-72" />
                                {q.length >= 2 && <span className="text-[11px] text-[#999] px-2 whitespace-nowrap">{matches.length ? `${hit + 1}/${matches.length}` : 'табылмады'}</span>}
                                <button onClick={() => goHit(hit - 1)} className="w-7 h-7 rounded-full text-[#C5A55A] hover:bg-[#C5A55A20]">↑</button>
                                <button onClick={() => goHit(hit + 1)} className="w-7 h-7 rounded-full text-[#C5A55A] hover:bg-[#C5A55A20]">↓</button>
                            </div>

                        {selN && <div className="flex flex-wrap items-center gap-1 text-[11px]">
                            {selPath.map((id, i) => <React.Fragment key={id}>{i > 0 && <span className="text-[#444]">›</span>}
                                <button onClick={() => reveal(id)} className="px-2 py-0.5 rounded-full border" style={{ borderColor: i === selPath.length - 1 ? '#C5A55A' : '#2a2a2a', color: i === selPath.length - 1 ? '#F0D882' : '#999' }}>{idx.byId[id].name}</button></React.Fragment>)}
                            <span className="text-[#777] ml-2">{selPath.length - 1}-буын · ұрпақтары {descCache[sel] || 0}</span>
                            {selN.children?.length > 0 && <button onClick={() => openBranch(sel)} className="ml-2 px-3 py-0.5 rounded-full text-black font-semibold" style={{ background: 'linear-gradient(135deg,#C5A55A,#8B6914)' }}>⊕ тармағын түгел ашу</button>}
                        </div>}
                    </div>
                    <div ref={box} onScroll={e => setScroll(e.currentTarget.scrollTop)} className="flex-1 overflow-auto">
                        <div style={{ height: rows.length * ROW_H + 110, position: 'relative', minWidth: 'max-content' }}>
                            {rows.slice(first, last).map((r, k) => { const i = first + k, n = r.n, has = n.children?.length, open = expanded.has(n.id);
                                const isSel = n.id === sel, isMain = mainSet.has(n.id) || n.isMainLine || n.highlight, isHit = matchSet.has(n.id);
                                return <div key={n.id} className="absolute left-0 flex items-center pr-6" style={{ top: i * ROW_H, height: ROW_H, paddingLeft: 12 + r.d * OL_IND() }}>
                                    {Array.from({ length: r.d }).map((_, j) => <span key={j} className="absolute top-0 bottom-0 w-px" style={{ left: 12 + OL_IND() / 2 + 8 + j * OL_IND(), background: selPath[j + 1] && selPath.includes(n.id) ? 'rgba(197,165,90,.5)' : 'rgba(197,165,90,.12)' }} />)}
                                    <button onClick={() => toggle(n)} className={`flex items-center gap-2 rounded-lg px-2 py-1 text-left transition-colors hover:bg-[#C5A55A14]${isSel ? ' ol-sel' : isHit ? ' ol-hit' : ''}`}
                                        style={{ background: isSel ? 'rgba(197,165,90,.22)' : isHit ? 'rgba(74,222,128,.12)' : 'transparent' }}>
                                        <span className="w-4 text-center text-[#C5A55A] text-xs">{has ? (open ? '▾' : '▸') : '·'}</span>
                                        <span className="ol-num text-[#8a8270] text-[10px] w-5 text-right tabular-nums">{r.d}</span>
                                        <span className={`ol-name text-[15px] whitespace-nowrap ${isMain ? 'font-semibold ol-main' : n.more ? 'ol-more' : ''}`} style={{ color: n.highlight ? '#FFF3C4' : isMain ? '#F0D882' : n.more ? '#5eead4' : '#f0e9da' }}>{n.name}</span>
                                        {n.label && <span className="text-[10px] text-[#C5A55A]">{n.label}</span>}
                                        {has && !open && <span className="ol-badge text-[10px] px-1.5 rounded-full bg-[#C5A55A26] text-[#C5A55A]">+{descCache[n.id]}</span>}
                                        {n.more && <span className="ol-tag text-[10px] px-1.5 rounded-full font-semibold" style={{ color: '#5eead4', background: 'rgba(56,189,168,.15)', border: '1px solid rgba(56,189,168,.5)' }} title="Продолжение на tumalas.kz">↗ жалғасы бар</span>}
                                    </button>
                                </div>; })}
                        </div>
                    </div>
                    <p className="text-center text-[9px] text-[#555] py-1">Қарамашақ-Төртқара тармағы: tumalas.kz · «…» — tumalas-та жалғасы бар</p>
                </div>
            );
        }

        function TreeScreen({ onBack }) {
            const [mode, setMode] = useState('3d');

        }

        const YURT_PARTS = [
            { id: 'kerege',   kk: 'Кереге',    ru: 'Решётчатые стены', order: 1, text: 'Раздвижная деревянная решётка из тальника. Складывается «гармошкой», поэтому юрту можно собрать за час. Размер юрты меряют числом канатов кереге: «алты қанат үй» — юрта из шести секций.' },

        function ornamentTexture(T, w = 1024, h = 64) {
            const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
            g.fillStyle = '#7a1f1f'; g.fillRect(0, 0, w, h);
            g.strokeStyle = '#E8C66A'; g.lineWidth = 4;
            for (let x = 0; x < w; x += 64) { // «қошқар мүйіз»
                g.beginPath(); g.moveTo(x + 32, h - 8); g.lineTo(x + 32, h / 2);
                g.bezierCurveTo(x + 32, 8, x + 8, 8, x + 12, h / 2 - 2); g.moveTo(x + 32, h / 2);
                g.bezierCurveTo(x + 32, 8, x + 56, 8, x + 52, h / 2 - 2); g.stroke();
            }
            g.fillStyle = '#E8C66A'; g.fillRect(0, 0, w, 4); g.fillRect(0, h - 4, w, 4);
            const t = new T.CanvasTexture(c); t.wrapS = T.RepeatWrapping; t.encoding = T.sRGBEncoding; return t;
        }

        function buildYurt(T, scene) {
            const R = 3, H = 1.6, top = 3.3, rTop = 0.62;
            const wood = new T.MeshStandardMaterial({ color: 0xb5651d, roughness: 0.7, metalness: 0.05, emissive: 0x000000 });
            const parts = {};
            const mk = (id, grp, explode, anchor) => { grp.userData.id = id; scene.add(grp); parts[id] = { grp, base: grp.position.clone(), explode, anchor, mats: [] }; grp.traverse(o => { if (o.material) { o.userData.part = id; parts[id].mats.push(o.material); } }); };

            // кереге — сетка диагоналей
            { const g = new T.Group(); const pts = []; const N = 72;
              for (let i = 0; i < N; i++) { const a0 = (i / N) * Math.PI * 2, a1 = ((i + 3) / N) * Math.PI * 2;
                if (a0 < 0.18 || a1 > Math.PI * 2 - 0.18) continue; // проём двери
                pts.push(new T.Vector3(Math.sin(a0) * R, 0, Math.cos(a0) * R), new T.Vector3(Math.sin(a1) * R, H, Math.cos(a1) * R));
                pts.push(new T.Vector3(Math.sin(a1) * R, 0, Math.cos(a1) * R), new T.Vector3(Math.sin(a0) * R, H, Math.cos(a0) * R)); }
              const ls = new T.LineSegments(new T.BufferGeometry().setFromPoints(pts), new T.LineBasicMaterial({ color: 0xd08a3c }));
              g.add(ls);
              const hit = new T.Mesh(new T.CylinderGeometry(R, R, H, 48, 1, true), new T.MeshBasicMaterial({ color: 0xd08a3c, transparent: true, opacity: 0.06, side: T.DoubleSide, depthWrite: false }));
              hit.position.y = H / 2; g.add(hit);
              mk('kerege', g, new T.Vector3(0, 0, 0), () => new T.Vector3(-R * 0.92, H * 0.5, R * 0.3)); }

            // есік
            { const g = new T.Group();
              const door = new T.Mesh(new T.BoxGeometry(0.9, 1.45, 0.08), new T.MeshStandardMaterial({ color: 0x8a3b12, roughness: 0.5, metalness: 0.1 }));
              door.position.set(0, 0.73, R + 0.04); g.add(door);
              const orn = new T.Mesh(new T.PlaneGeometry(0.7, 0.18), new T.MeshBasicMaterial({ map: ornamentTexture(T, 256, 64) }));
              orn.position.set(0, 1.2, R + 0.09); g.add(orn);
              mk('esik', g, new T.Vector3(0, 0, 2.2), () => new T.Vector3(0, 0.9, R + 0.1)); }

            // уық
            { const g = new T.Group(); const N = 48;
              for (let i = 0; i < N; i++) { const a = (i / N) * Math.PI * 2;
                const c = new T.CubicBezierCurve3(new T.Vector3(Math.sin(a) * R, H, Math.cos(a) * R), new T.Vector3(Math.sin(a) * R * 0.98, H + 0.45, Math.cos(a) * R * 0.98),
                    new T.Vector3(Math.sin(a) * R * 0.55, top - 0.35, Math.cos(a) * R * 0.55), new T.Vector3(Math.sin(a) * rTop, top, Math.cos(a) * rTop));
                g.add(new T.Mesh(new T.TubeGeometry(c, 10, 0.022, 4, false), wood)); }
              mk('uyk', g, new T.Vector3(0, 1.4, 0), () => new T.Vector3(R * 0.62, H + 0.95, R * 0.4)); }

            // шаңырақ
            { const g = new T.Group();
              const ring = new T.Mesh(new T.TorusGeometry(rTop, 0.07, 10, 48), new T.MeshStandardMaterial({ color: 0xc27a2c, roughness: 0.5, metalness: 0.15 }));
              ring.rotation.x = Math.PI / 2; ring.position.y = top; g.add(ring);
              mk('shanyrak', g, new T.Vector3(0, 3.0, 0), () => new T.Vector3(rTop, top, 0)); }

            // күлдіреуіш — по 3 дуги в двух направлениях
            { const g = new T.Group(); const m = new T.MeshStandardMaterial({ color: 0xe0a04a, roughness: 0.5 });
              [-0.32, 0, 0.32].forEach(o => [0, Math.PI / 2].forEach(rot => {
                const half = Math.sqrt(rTop * rTop - o * o);
                const c = new T.QuadraticBezierCurve3(new T.Vector3(-half, 0, o), new T.Vector3(0, 0.38, o), new T.Vector3(half, 0, o));
                const mesh = new T.Mesh(new T.TubeGeometry(c, 16, 0.025, 5, false), m); mesh.rotation.y = rot; mesh.position.y = top; g.add(mesh); }));
              mk('kuldireush', g, new T.Vector3(0, 4.0, 0), () => new T.Vector3(0, top + 0.3, 0)); }

            { const g = new T.Group(); const tex = ornamentTexture(T); tex.repeat.set(6, 1);

              band.position.y = H - 0.12; g.add(band);

            // туырлық
            { const g = new T.Group();
              const felt = new T.Mesh(new T.CylinderGeometry(R + 0.06, R + 0.06, H, 64, 1, true, 0.17, Math.PI * 2 - 0.34),
                new T.MeshStandardMaterial({ color: 0xe8dcc4, roughness: 1, transparent: true, opacity: 0.78, side: T.DoubleSide }));
              felt.position.y = H / 2; g.add(felt);
              mk('tuyrlyk', g, new T.Vector3(0, 0, 0), () => new T.Vector3(R * 0.95, H * 0.35, -R * 0.3)); parts.tuyrlyk.scaleOut = 1.45; }

            // үзік
            { const g = new T.Group();
              const roof = new T.Mesh(new T.CylinderGeometry(rTop + 0.06, R + 0.1, top - H, 64, 1, true),

              const pos = t.geometry.attributes.position; for (let i = 0; i < pos.count; i++) { const x = pos.getX(i), y = pos.getY(i); pos.setZ(i, -0.25 * (x * x + y * y)); }
              t.geometry.computeVertexNormals(); t.rotation.x = -Math.PI / 2; t.position.y = top + 0.12; g.add(t);

              fire.position.y = 0.32; g.add(fire); g.userData.fire = fire;

            floor.rotation.x = -Math.PI / 2; floor.position.y = 0.005; scene.add(floor);

        function tamgaCoinTexture(T, glyph, title, bump = false) {
            const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
            if (bump) { g.fillStyle = '#000'; g.fillRect(0, 0, 1024, 1024); }
            else { const gr = g.createRadialGradient(400, 380, 50, 512, 512, 560); gr.addColorStop(0, '#F6E2A0'); gr.addColorStop(0.55, '#C5A55A'); gr.addColorStop(1, '#6b4f12'); g.fillStyle = gr; g.fillRect(0, 0, 1024, 1024); }
            const col = bump ? '#fff' : '#5a3f0a';
            g.strokeStyle = col; g.lineWidth = 14; g.beginPath(); g.arc(512, 512, 470, 0, Math.PI * 2); g.stroke();
            g.lineWidth = 6; g.beginPath(); g.arc(512, 512, 430, 0, Math.PI * 2); g.stroke();
            for (let k = 0; k < 24; k++) { const a = k / 24 * Math.PI * 2; g.save(); g.translate(512 + Math.cos(a) * 450, 512 + Math.sin(a) * 450); g.rotate(a); g.fillStyle = col; g.fillRect(-4, -12, 8, 24); g.restore(); }
            g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'middle';
            g.font = '520px "Cinzel", "Segoe UI Symbol", "Noto Sans Symbols 2", serif'; g.fillText(glyph, 512, 490);
            g.font = '700 70px Inter, sans-serif'; g.fillText(title, 512, 830);
            const t = new T.CanvasTexture(c); t.center.set(0.5, 0.5); t.rotation = Math.PI / 2; if (!bump) t.encoding = T.sRGBEncoding; return t;
        }

        const ZHUZ_INFO = {

        function YurtAtlas() {
            const mountRef = useRef(null); const S = useRef(null); const partsRef = useRef(null);
            const { svgRef, boxRef, update } = useLeaders();
            const labelEls = useRef({});
            const [active, setActive] = useState(null);
            const [explode, setExplode] = useState(0);
            const [build, setBuild] = useState(null); // прогресс сборки
            const st = useRef({ explode: 0, active: null, build: null });
            st.current.explode = explode; st.current.active = active; st.current.build = build;

            const err = useThree(mountRef, {
                opts: { distance: 14.5, target: [0, 0.6, 0], minDist: 5, maxDist: 30 },
                run: (stage) => {
                    S.current = stage; const { T, scene } = stage;
                    addStarDust(T, scene, 500, 40); addGroundOrnament(T, scene, -0.02, 5);
                    const parts = buildYurt(T, scene); partsRef.current = parts;
                    const meshes = []; Object.values(parts).forEach(p => p.grp.traverse(o => { if (o.isMesh || o.isLineSegments) meshes.push(o); }));
                    let cur = 0;
                    stage.onFrame((dt, t) => {
                        cur += (st.current.explode - cur) * Math.min(1, dt * 6);
                        const b = st.current.build;
                        YURT_PARTS.forEach(def => {
                            const p = parts[def.id]; if (!p) return;
                            let k = cur, vis = true;
                            if (b !== null) { const lt = b - def.order + 1; vis = lt > 0; k = vis ? Math.max(0, 1 - lt) * 2.2 : 3; }
                            p.grp.visible = vis;
                            p.grp.position.copy(p.base).addScaledVector(p.explode, k);
                            if (p.scaleOut) { const s = 1 + (p.scaleOut - 1) * (b === null ? cur : Math.min(1, k)); p.grp.scale.set(s, 1, s); }
                            const on = st.current.active === def.id;
                            p.mats.forEach(m => { if (m.emissive) m.emissive.setHex(on ? 0x6b4a10 : 0x000000); if ('opacity' in m && m.userData.op0 === undefined) m.userData.op0 = m.opacity; });
                        });
                        const fire = parts.oshak?.grp.userData.fire; if (fire) { fire.scale.y = 1 + Math.sin(t * 9) * 0.12; fire.material.opacity = 0.7 + Math.sin(t * 13) * 0.15; }
                        const items = YURT_PARTS.filter(d => parts[d.id]?.grp.visible).map(d => ({ id: d.id, el: labelEls.current[d.id], anchor: () => parts[d.id].anchor().applyMatrix4(parts[d.id].grp.matrixWorld) }));
                        YURT_PARTS.forEach(d => { const el = labelEls.current[d.id]; if (el && !parts[d.id].grp.visible) el.style.opacity = 0; });
                        update(stage, items, st.current.active);
                    });
                    stage.onClick(e => { const h = stage.pick(e, meshes); let id = null; h?.object && (id = h.object.userData.part || null); setActive(a => (id && a !== id) ? id : null); });
                },
            }, []);

            // сборка юрты по шагам
            useEffect(() => {
                if (build === null) return;
                if (build >= YURT_PARTS.length + 1) { const t = setTimeout(() => setBuild(null), 600); return () => clearTimeout(t); }
                const t = setTimeout(() => setBuild(b => b + 0.04), 28);
                const step = YURT_PARTS.find(p => Math.floor(build) === p.order);
                if (step && active !== step.id && build - Math.floor(build) < 0.05) setActive(step.id);
                return () => clearTimeout(t);
            }, [build]);

            const def = YURT_PARTS.find(p => p.id === active);
            return (
                <div ref={boxRef} className="absolute inset-0">
                    <div ref={mountRef} className="absolute inset-0" />
                    {err && <div className="absolute inset-0 flex items-center justify-center text-[#C5A55A] text-sm">{err}</div>}
                    <svg ref={svgRef} className="absolute inset-0 w-full h-full pointer-events-none" />
                    {YURT_PARTS.map(p => (
                        <button key={p.id} ref={el => labelEls.current[p.id] = el} onClick={() => setActive(a => a === p.id ? null : p.id)}
                            className="absolute px-2 py-0.5 rounded text-[11px] md:text-xs whitespace-nowrap transition-colors"
                            style={{ color: active === p.id ? '#000' : '#E8D5A0', background: active === p.id ? '#C5A55A' : 'rgba(8,8,8,0.6)', top: 0, left: 0 }}>
                            <b>{p.kk}</b><span className="hidden sm:inline opacity-60"> · {p.ru}</span>
                        </button>
                    ))}
                    <div className="absolute bottom-4 left-1/2 -translate-x-1/2 w-[min(520px,calc(100vw-32px))] space-y-3">
                        {def && <div className="rounded-2xl p-4 border border-[#C5A55A40]" style={{ background: 'rgba(10,10,10,0.92)', backdropFilter: 'blur(8px)' }}>
                            <p className="text-[#C5A55A] text-[9px] tracking-[0.4em] uppercase">{def.order}-қадам · шаг сборки</p>
                            <h3 className="text-xl font-serif text-white">{def.kk} <span className="text-[#777] text-sm">— {def.ru}</span></h3>
                            <p className="text-[#bbb] text-xs leading-relaxed mt-1">{def.text}</p>
                        </div>}
                        <div className="flex items-center gap-3 rounded-full px-4 py-2 border border-[#222]" style={{ background: 'rgba(8,8,8,0.85)' }}>
                            <span className="text-[#777] text-[10px] uppercase tracking-widest whitespace-nowrap">Жинау</span>
                            <input type="range" min="0" max="1" step="0.01" value={explode} onChange={e => { setBuild(null); setExplode(+e.target.value); }} className="flex-1 accent-[#C5A55A]" />
                            <span className="text-[#777] text-[10px] uppercase tracking-widest whitespace-nowrap">Бөлшектеу</span>
                            <button className={btn3d} style={btnStyle(build !== null)} onClick={() => { setExplode(0); setBuild(b => b === null ? 0 : null); }}>{build === null ? '▶ Тігу' : '■'}</button>
                        </div>
                    </div>
                </div>

        }

        function TamgaAtlas() {
            const mountRef = useRef(null); const S = useRef(null); const coin = useRef(null);
            const { svgRef, boxRef, update } = useLeaders(); const labelEls = useRef({});
            const keys = Object.keys(TRIBES_DB);
            const [key, setKey] = useState(() => { try { const u = localStorage.getItem('shejire_user'); const p = u && (JSON.parse(localStorage.getItem('shejire_profile_' + u) || 'null') || CABINET_USERS[u]?.profile); return (p && TRIBES_DB[p.tribe]) ? p.tribe : keys[0]; } catch { return keys[0]; } });
            const t = TRIBES_DB[key];
            const LBL = [{ id: 'g', kk: 'Тамға', ru: 'родовой знак' }, { id: 'r', kk: 'Өрнек жиегі', ru: 'орнаментальный обод' }, { id: 'n', kk: 'Ру атауы', ru: 'имя рода' }, { id: 'e', kk: 'Қыры', ru: 'гурт печати' }];

                run: (stage) => {
                    S.current = stage; const { T, scene } = stage; stage.st.phi = Math.PI / 2; stage.st.theta = 0.4;

                    const face = new T.MeshStandardMaterial({ metalness: 0.75, roughness: 0.35, bumpScale: 0.06 });

                        face.map = tamgaCoinTexture(T, glyph, name); face.bumpMap = tamgaCoinTexture(T, glyph, name, true); face.needsUpdate = true;
                    } };

                    stage.onFrame((dt, tm) => {

                        update(stage, LBL.map(l => ({ id: l.id, el: labelEls.current[l.id], anchor: () => anchors[l.id].clone().applyMatrix4(grp.matrixWorld) })), null);
                    });
                    stage.setAuto(false);

            return (

                            <h3 className="text-xl font-serif text-white">{t.name} <span className="text-[#C5A55A]">{t.tamga}</span></h3>
                            <p className="text-[#bbb] text-xs leading-relaxed mt-1">{t.story}</p>

                                className="shrink-0 w-10 h-10 rounded-xl border text-lg" style={{ borderColor: k === key ? '#C5A55A' : '#222', color: k === key ? '#000' : '#C5A55A', background: k === key ? '#C5A55A' : 'rgba(8,8,8,0.8)' }}>{TRIBES_DB[k].tamga}</button>)}

        function ZhuzAtlas() {
            const mountRef = useRef(null);
            const [sel, setSel] = useState(null);
            const err = useThree(mountRef, {
                opts: { distance: 22, target: [0, 0, 0], minDist: 8, maxDist: 50 },
                run: (stage) => {
                    const { T, scene } = stage; stage.st.phi = 1.0;
                    addStarDust(T, scene, 800, 50);
                    const glow = glowTexture(T); const pick = [];
                    const sph = new T.SphereGeometry(1, 32, 20);
                    const center = new T.Mesh(sph, new T.MeshStandardMaterial({ color: GOLD3, emissive: GOLD3, emissiveIntensity: 0.5, metalness: 0.6, roughness: 0.3 }));
                    center.scale.setScalar(0.9); scene.add(center);
                    const cg = new T.Sprite(new T.SpriteMaterial({ map: glow, transparent: true, blending: T.AdditiveBlending, depthWrite: false })); cg.scale.setScalar(5); scene.add(cg);
                    const cl = makeTextSprite(T, 'АЛАШ', { size: 0.9, color: '#FFF3C4', weight: 800 }); cl.position.set(0, 1.6, 0); scene.add(cl);
                    center.userData.info = { title: 'Алаш', sub: 'Қазақтың аңыздағы түп атасы', text: 'Аңыз бойынша қазақтар — Алаштың ұрпағы. Халық үш жүзге бөлінеді. Жүзге кірмейтін топтар да бар: Төре (Шыңғыс ұрпағы), Қожа, Төлеңгіт.' };
                    pick.push(center);
                    const orbits = [];
                    [ZHUZES.ULY, ZHUZES.ORTA, ZHUZES.KISHI].forEach((z, i) => {
                        const info = ZHUZ_INFO[z]; const a = i / 3 * Math.PI * 2;
                        const pos = new T.Vector3(Math.sin(a) * 7, 0, Math.cos(a) * 7);
                        const m = new T.Mesh(sph, new T.MeshStandardMaterial({ color: info.color, emissive: info.color, emissiveIntensity: 0.35, metalness: 0.5, roughness: 0.35 }));
                        m.scale.setScalar(0.7); m.position.copy(pos); scene.add(m);
                        const list = Object.entries(TRIBES_DB).filter(([, t]) => t.juz === z);
                        m.userData.info = { title: z, sub: info.land + ' · ' + info.ru, text: `${info.saying}\n\nРулары: ${list.map(([, t]) => t.name).join(', ')}.` };
                        pick.push(m);
                        const l = makeTextSprite(T, z.toUpperCase(), { size: 0.6, color: '#fff', weight: 700 }); l.position.copy(pos).add(new T.Vector3(0, 1.3, 0)); scene.add(l);
                        scene.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(), pos]), new T.LineBasicMaterial({ color: info.color, transparent: true, opacity: 0.5 })));
                        const ring = new T.Mesh(new T.RingGeometry(2.48, 2.5, 96), new T.MeshBasicMaterial({ color: info.color, transparent: true, opacity: 0.25, side: T.DoubleSide }));
                        ring.rotation.x = -Math.PI / 2; ring.position.copy(pos); scene.add(ring);
                        const orb = new T.Group(); orb.position.copy(pos); scene.add(orb); orbits.push({ orb, sp: 0.12 + i * 0.03 });
                        list.forEach(([key, t], j) => {
                            const b = j / list.length * Math.PI * 2;

                            s.position.set(Math.cos(b) * 2.5, Math.sin(j * 1.7) * 0.4, Math.sin(b) * 2.5);

        // Озвучка: казахский голос, если есть; иначе — турецкий/русский как запасной
        function useSpeech() {

                pickV(); speechSynthesis.addEventListener?.('voiceschanged', pickV);
                return () => speechSynthesis.removeEventListener?.('voiceschanged', pickV);
            }, []);
            const say = (text) => { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text); u.lang = voice?.lang || 'kk-KZ'; if (voice) u.voice = voice; u.rate = 0.85; speechSynthesis.speak(u); };

        }

        const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

        function registerPart(parts, id, grp, explode, anchor) {
            grp.userData.id = id;
            const p = { grp, base: grp.position.clone(), explode: explode || new THREE.Vector3(), anchor, mats: [] };
            grp.traverse(o => { if (o.material) { o.userData.part = id; (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => p.mats.push(m)); } });
            parts[id] = p; return p;
        }

        function AnatomyViewer({ PARTS, scene: buildScene, opts, controls, intro, explodable = true, stepLabel = 'бөлік' }) {

        const woodMat = (c = 0xa0522d) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, metalness: 0.08 });
        const tube = (T, pts, r, mat, seg = 24) => new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), seg, r, 8, false), mat);

        // ── Звук: щипок струны (алгоритм Карплуса — Стронга) ──
        let _actx = null;
        function pluck(freq, { dur = 2.2, gain = 0.35, bright = 0.5 } = {}) {
            try {
                _actx = _actx || new (window.AudioContext || window.webkitAudioContext)();
                if (_actx.state === 'suspended') _actx.resume();
                const sr = _actx.sampleRate, N = Math.max(2, Math.round(sr / freq)), len = Math.floor(sr * dur);
                const buf = _actx.createBuffer(1, len, sr), d = buf.getChannelData(0), ring = new Float32Array(N);
                for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
                let idx = 0, decay = 0.996 - (1 - bright) * 0.004;
                for (let i = 0; i < len; i++) {
                    const nx = (idx + 1) % N; const v = ring[idx];
                    ring[idx] = decay * 0.5 * (v + ring[nx]); d[i] = v; idx = nx;
                }
                const src = _actx.createBufferSource(); src.buffer = buf;
                const g = _actx.createGain(); g.gain.value = gain;
                const f = _actx.createBiquadFilter(); f.type = 'peaking'; f.frequency.value = 900; f.gain.value = 5; // «шанақ» резонанс
                src.connect(f).connect(g).connect(_actx.destination); src.start();
            } catch (e) { console.warn(e); }
        }

        // ═════════════════════  ДОМБЫРА  ═════════════════════
        const DOMBRA_PARTS = [
            { id: 'shanaq',  kk: 'Шанақ',   ru: 'Корпус',            text: 'Грушевидный выдолбленный или клеёный корпус. Это резонатор: от его объёма и породы дерева зависит голос домбры. Лучшие шанақ делали из тутовника и клёна.' },

        ];
        const DOMBRA_STRINGS = [146.83, 196.0]; // ре, соль
        const PERNE = [0, 2, 3, 5, 7, 8, 10, 12, 14, 15];

        function buildDombra(T, scene, S) {
            const parts = {};
            const bodyH = 3.0, neckTop = 7.6, bridgeY = 0.75;
            const prof = (t) => t <= 0 ? 0 : 0.26 + 1.04 * Math.sin(Math.PI * Math.min(1, Math.pow(t, 0.72) * 0.93));
            // шанақ — задняя половина «груши»
            { const pts = []; for (let i = 0; i <= 40; i++) { const t = i / 40; pts.push(new T.Vector2(Math.max(0.001, prof(t)), t * bodyH)); }
              const g = new T.Group();
              const m = new T.Mesh(new T.LatheGeometry(pts, 48, Math.PI / 2, Math.PI), new T.MeshStandardMaterial({ color: 0x6b2f12, roughness: 0.35, metalness: 0.15, side: T.DoubleSide }));
              m.scale.z = 0.55; g.add(m);
              // рёбра-клёпки
              for (let k = 1; k < 7; k++) { const a = Math.PI / 2 + k * Math.PI / 7; const rib = [];
                for (let i = 1; i < 40; i++) { const t = i / 40; const r = prof(t) * 1.004; rib.push(new T.Vector3(Math.sin(a) * r, t * bodyH, Math.cos(a) * r * 0.55)); }
                g.add(new T.Line(new T.BufferGeometry().setFromPoints(rib), new T.LineBasicMaterial({ color: 0xe0a060, transparent: true, opacity: 0.5 }))); }
              registerPart(parts, 'shanaq', g, new T.Vector3(0, 0, -1.6), () => new T.Vector3(-1.05, 1.2, -0.4)); }
            // қақпақ
            { const sh = new T.Shape(); sh.moveTo(0, 0);
              for (let i = 1; i <= 40; i++) { const t = i / 40; sh.lineTo(prof(t), t * bodyH); }
              for (let i = 40; i >= 0; i--) { const t = i / 40; sh.lineTo(-prof(t), t * bodyH); }
              [[0, 1.75, 0.09], [-0.3, 1.6, 0.06], [0.3, 1.6, 0.06], [-0.18, 1.95, 0.05], [0.18, 1.95, 0.05]].forEach(([x, y, r]) => { const h = new T.Path(); h.absarc(x, y, r, 0, Math.PI * 2, true); sh.holes.push(h); });
              const g = new T.Group();
              const m = new T.Mesh(new T.ShapeGeometry(sh, 32), new T.MeshStandardMaterial({ color: 0xe8c48a, roughness: 0.6, side: T.DoubleSide }));
              m.position.z = 0.005; g.add(m);
              // ою по краю деки
              const edge = []; for (let i = 6; i <= 36; i++) { const t = i / 40; edge.push(new T.Vector3(prof(t) * 0.86, t * bodyH, 0.012)); }
              for (let i = 36; i >= 6; i--) { const t = i / 40; edge.push(new T.Vector3(-prof(t) * 0.86, t * bodyH, 0.012)); }
              g.add(new T.Line(new T.BufferGeometry().setFromPoints(edge), new T.LineBasicMaterial({ color: 0x7a3a12 })));
              registerPart(parts, 'qaqpaq', g, new T.Vector3(0, 0, 0.9), () => new T.Vector3(0.75, 1.05, 0.02)); }
            // үн тесігі (подсветка: кольца вокруг отверстий)

        const ASYQ_WEIGHTS = [['buk', 0.39], ['shik', 0.39], ['alshy', 0.11], ['taiki', 0.11]];

        function asyqGeometry(T, s = 1) {
            const g = new T.SphereGeometry(1, 48, 32); const p = g.attributes.position; const v = new T.Vector3();
            for (let i = 0; i < p.count; i++) {
                v.fromBufferAttribute(p, i);
                let { x, y, z } = v; x *= 1.45; y *= 0.72; z *= 0.82;
                if (y > 0) y += 0.18 * Math.exp(-(x * x) * 1.2) * (1 - Math.abs(z));          // бүк — горб
                if (y < -0.3) y += 0.32 * Math.exp(-(x * x + z * z) * 2.2);                     // шік — ямка
                if (z > 0.55) z = 0.55 + (z - 0.55) * 0.25;                                     // алшы — площадка
                if (z < -0.5) { z = -0.5 + (z + 0.5) * 0.4; z += 0.12 * Math.exp(-(x * x) * 6); } // тәйкі — выемка
                const w = 1 - 0.18 * Math.exp(-(x * x) * 3); y *= w; z *= w;                    // перехват в середине
                p.setXYZ(i, x * s, y * s, z * s);
            }
            g.computeVertexNormals(); return g;
        }

        function buildAsyq(T, scene, S) {
            const parts = {};
            const bone = new T.MeshStandardMaterial({ color: 0xeee0c0, roughness: 0.55, metalness: 0.02 });
            const main = new T.Group(); const m = new T.Mesh(asyqGeometry(T), bone); main.add(m); scene.add(main);
            // точки-якоря сторон (невидимые группы, двигаются вместе с асыком)
            Object.entries(ASYQ_FACES).forEach(([id, n]) => {
                const g = new T.Group(); main.add(g);
                const p = new T.Vector3(...n).multiply(new T.Vector3(1.2, 0.85, 0.62));
                parts[id] = { grp: g, base: new T.Vector3(), explode: new T.Vector3(), anchor: () => p.clone(), mats: [], locked: true };
            });
            // сақа — крупный красный биток рядом
            { const g = new T.Group(); const sm = new T.Mesh(asyqGeometry(T, 1.0), new T.MeshStandardMaterial({ color: 0xa3281e, roughness: 0.4, metalness: 0.2 }));
              g.add(sm); g.scale.setScalar(0.8); g.position.set(3.4, -0.35, -1.0); g.rotation.set(0, 0.6, 0); scene.add(g);
              registerPart(parts, 'saqa', g, new T.Vector3(), () => new T.Vector3(0, 0.9, 0)); parts.saqa.locked = true; }
            // кийіз-подстилка
            const felt = new T.Mesh(new T.CircleGeometry(5, 64), new T.MeshStandardMaterial({ color: 0x2a0c08, roughness: 1 }));
            felt.rotation.x = -Math.PI / 2; felt.position.y = -0.85; scene.add(felt);
            const ring = new T.Mesh(new T.RingGeometry(4.6, 4.75, 64), new T.MeshBasicMaterial({ color: GOLD3, side: T.DoubleSide })); ring.rotation.x = -Math.PI / 2; ring.position.y = -0.84; scene.add(ring);

            const up = new T.Vector3(0, 1, 0);
            const target = (face) => { const n = new T.Vector3(...ASYQ_FACES[face]); return new T.Quaternion().setFromUnitVectors(n, up).premultiply(new T.Quaternion().setFromAxisAngle(up, Math.random() * Math.PI * 2)); };
            const restY = { buk: -0.1, shik: -0.15, alshy: -0.25, taiki: -0.25 };
            let throwSt = null; let cb = null;
            main.quaternion.copy(target('alshy')); main.position.y = restY.alshy;
            const toss = (onDone) => {
                let r = Math.random(), face = 'buk'; for (const [f, w] of ASYQ_WEIGHTS) { if ((r -= w) <= 0) { face = f; break; } }
                throwSt = { t: 0, face, q1: target(face), axis: new T.Vector3(Math.random() - 0.5, Math.random(), Math.random() - 0.5).normalize(), spins: 4 + Math.random() * 3, x0: main.position.x };
                cb = onDone;
            };
            const tick = (dt) => {
                if (!throwSt) return; const s = throwSt; s.t = Math.min(1, s.t + dt / 1.6); const k = s.t;
                const h = k < 0.6 ? Math.sin(k / 0.6 * Math.PI) * 3.2 : Math.abs(Math.sin((k - 0.6) / 0.4 * Math.PI * 2)) * 0.35 * (1 - k) * 2.5;
                main.position.y = restY[s.face] + h;
                const ang = s.spins * Math.PI * 2 * Math.pow(1 - k, 2);
                main.quaternion.copy(s.q1).multiply(new T.Quaternion().setFromAxisAngle(s.axis, ang));
                if (k >= 1) { throwSt = null; cb?.(s.face); }
            };
            S.st.phi = 1.05; S.st.theta = 0.5;
            return { parts, tick, api: { toss } };
        }

        const KZ_BACK = 'аоұыу', KZ_FRONT = 'әөүіеи';
        const kzLastVowel = (w) => { for (let i = w.length - 1; i >= 0; i--) { const c = w[i].toLowerCase(); if (KZ_BACK.includes(c)) return 'back'; if (KZ_FRONT.includes(c)) return 'front'; if ('я'.includes(c)) return 'back'; } return 'back'; };
        const kzLast = (w) => w.trim().slice(-1).toLowerCase();

        function DialogTab({ sp, addXp }) {

                t += dt; me.g.position.x += Math.sin(me.h) * me.v * dt; me.g.rotation.y = me.h; me.g.userData.animate(dt, me.v);
                const sway = Math.sin(t * 1.4) * 0.25 + wind * 0.1; const jp = anchor.clone().add(new T.Vector3(Math.sin(sway) * 2.2, -Math.cos(sway) * 2.2, 0));

                if (input.is('left')) input.pointer.x -= dt * 0.8; if (input.is('right')) input.pointer.x += dt * 0.8; if (input.is('up')) input.pointer.y += dt * 0.8; if (input.is('down')) input.pointer.y -= dt * 0.8;

        // 10 ── ОРАМАЛ ТАСТАУ ───────────────────────────────────────────────
        function gameOramal(S, api) {
            const { T, scene, camera, input } = S; buildSteppe(T, scene, { clear: 30 });
            const N = 10, R = 6, RR = 7.6; const sitters = [];
            for (let i = 0; i < N; i++) { const a = i / N * Math.PI * 2; const p = makePerson(T, { robe: [0x3a5a8a, 0x8a3a2a, 0x2f6a3a, 0x8a7a2a, 0x6a3a8a][i % 5], hat: i % 2 ? 'kalpak' : 'uki', seated: true }); p.position.set(Math.cos(a) * R, -0.55, Math.sin(a) * R); p.lookAt(0, -0.55, 0); scene.add(p); sitters.push({ p, a }); }
            const me = makePerson(T, { robe: 0x1d4fa0, belt: 0xF0D882 }); scene.add(me);
            const chaser = { p: null, a: 0 };
            const cloth = new T.Mesh(new T.PlaneGeometry(0.5, 0.5), lam(T, 0xc23b2b, { side: T.DoubleSide })); cloth.visible = false; scene.add(cloth);
            let a = 0, st = 'run', round = 1, wins = 0, target = null, react = 0, t = 0, speed = 0;
            const place = (o, ang, r) => { o.position.set(Math.cos(ang) * r, 0, Math.sin(ang) * r); o.rotation.y = -ang; };
            camera.position.set(0, 8.5, 12.5); camera.lookAt(0, 0, 0.5);
            api.hud({ _msg: 'Жүгіріп, біреудің артына орамал тастаңыз' });
            S.onFrame((dt) => {
                t += dt; const want = input.is('up') || input.is('right') ? 5.2 : 3.2; speed += (want - speed) * dt * 3;
                a += speed / RR * dt; place(me, a, RR); me.userData.walk(t * 9, 0.7);
                if (st === 'run') {
                    if (input.hit('action')) { const near = sitters.reduce((b, s) => { const d = ((a - s.a) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2); return d < b.d ? { s, d } : b; }, { s: null, d: 9 });
                        target = near.s; target.d = near.d; cloth.visible = true; cloth.position.set(Math.cos(target.a) * (R + 0.9), 0.05, Math.sin(target.a) * (R + 0.9)); cloth.rotation.x = -Math.PI / 2;
                        react = 0.5 + Math.random() * 0.8 - round * 0.05; st = 'drop'; api.hud({ _msg: 'Тастадыңыз! Шеңберді айналып, оның орнына отырыңыз!' }); target.start = a; }
                } else if (st === 'drop') {
                    react -= dt; if (react <= 0) { st = 'chase'; chaser.p = target.p; chaser.a = target.start - target.d; target.p.position.y = 0; target.p.userData.legs.forEach(l => { l.rotation.x = 0; l.rotation.z = 0; }); cloth.visible = false; api.hud({ _msg: 'Ол тұрды — қашыңыз!' }); }
                }
                if (st === 'chase') { chaser.a += (4.9 + round * 0.18) / RR * dt; place(chaser.p, chaser.a, RR - 0.3); chaser.p.userData.walk(t * 10, 0.8);
                    const gap = a - chaser.a; if (gap < 0.12) { st = 'end'; api.hud({ _msg: 'Ұсталып қалдыңыз!' }); }
                    if (a >= target.start - target.d + Math.PI * 2) { st = 'end'; wins++; api.hud({ _msg: 'Орынға отырдыңыз! ✓' }); } }
                if (st === 'end') { react += dt; if (react > 1.5) {
                    if (chaser.p) { chaser.p.position.set(Math.cos(target.a) * R, -0.55, Math.sin(target.a) * R); chaser.p.lookAt(0, -0.55, 0); chaser.p.userData.legs.forEach((l, i) => { l.rotation.x = -1.3; l.rotation.z = (i ? -1 : 1) * 0.5; }); }
