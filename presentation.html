<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAMGA AI — Investor Presentation</title>
    <!-- Social Sharing Meta Tags -->
    <meta property="og:title" content="TAMGA AI — Архитектор Цифрового Наследия">
    <meta property="og:description" content="Оцифровка генеалогии кочевников через Web3 и Искусственный Интеллект.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-void: #080808;
            --bg-surface: #111111;
            --gold-primary: #C5A55A;
            --gold-deep: #8B6914;
            --gold-light: #E8D5A0;
            --gold-glow: rgba(197, 165, 90, 0.2);
            --text-primary: #FFFFFF;
            --text-secondary: #999999;
        }

        body {
            background-color: var(--bg-void);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        .slide-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            transition: transform 1s cubic-bezier(0.85, 0, 0.15, 1);
        }

        .slide {
            width: 100vw;
            height: 100vh;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            box-sizing: border-box;
            background: radial-gradient(circle at center, rgba(197, 165, 90, 0.05) 0%, transparent 75%);
        }

        .gold-underline {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            width: 100%;
            margin: 2rem 0;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(197, 165, 90, 0.1);
            backdrop-filter: blur(20px);
            padding: 3.5rem;
            border-radius: 3rem;
            max-width: 900px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .nav-button {
            position: fixed;
            bottom: 2.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(197, 165, 90, 0.2);
            color: var(--gold-primary);
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.4s;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-button:hover {
            background: var(--gold-primary);
            color: black;
            box-shadow: 0 0 30px var(--gold-glow);
            transform: scale(1.1);
        }

        .nav-dots {
            position: fixed;
            bottom: 3.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1.2rem;
            z-index: 100;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--gold-primary);
            box-shadow: 0 0 15px var(--gold-primary);
            width: 30px;
            border-radius: 6px;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-fade-scale {
            animation: fadeInScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .tamga-bg {
            position: fixed;
            font-size: 45rem;
            color: var(--gold-primary);
            opacity: 0.03;
            z-index: -1;
            pointer-events: none;
            font-family: serif;
            transition: all 2s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const slides = [
            {
                id: "cover",
                title: "TAMGA AI",
                subtitle: "Архитектор Цифрового Наследия",
                content: "Оцифровка генеалогии кочевников через Web3 и Искусственный Интеллект.",
                icon: "⩔"
            },
            {
                id: "vision",
                title: "Степь была первым Интернетом",
                content: "Каждый род был узлом сети, а тамга — цифровой подписью. Мы не создаем новое, мы переносим древнюю систему связей в блокчейн.",
                highlight: "Наследие в коде.",
                icon: "⫝"
            },
            {
                id: "problem",
                title: "Проблема: Хрупкость Наследия",
                items: [
                    "Устная традиция (Шежіре) теряется с поколениями.",
                    "Архивы уязвимы и централизованы.",
                    "Молодежь теряет связь с корнями в глобальном мире."
                ],
                icon: "△"
            },
            {
                id: "solution",
                title: "Решение: TAMGA Protocol",
                content: "Децентрализованный протокол генеалогии, защищенный криптографией.",
                tags: ["Soulbound Tokens (SBT)", "IPFS Storage", "DAO Governance"],
                icon: "◯"
            },
            {
                id: "dna-kit",
                title: "TAMGA DNA Kit",
                subtitle: "Hardware Verification",
                content: "Мы создаем физический уровень подтверждения наследия. Генетический тест, который связывает биологию с блокчейном.",
                icon: "🧬"
            },
            {
                id: "dna-flow",
                title: "Экосистема DNA",
                content: "Результаты теста автоматически верифицируют ваш статус в DAO и повышают рейтинг SBT до 'GOLD'.",
                items: [
                    "Верификация Y-хромосомы для подтверждения прямой линии.",
                    "Автоматическое сопоставление с базой данных родов.",
                    "Включение в глобальную карту миграций предков."
                ],
                icon: "✨"
            },
            {
                id: "product",
                title: "Продукт: Как это работает?",
                steps: [
                    { label: "01. Discovery", desc: "AI оживляет историю вашего рода на основе данных историков (Радик Темиргалиев)." },
                    { label: "02. Validation", desc: "Протокол «Жеті Ата» — проверка генеалогической цепи." },
                    { label: "03. Mint", desc: "Выпуск вечного цифрового паспорта (SBT), который нельзя продать." }
                ],
                icon: "⊥"
            },
            {
                id: "dao",
                title: "Род как DAO",
                content: "Каждое племя становится децентрализованной организацией. Голос в цифровом Курултае через владение SBT.",
                highlight: "Цифровой Курултай в смартфоне.",
                icon: "⧖"
            },
            {
                id: "market",
                title: "Рынок и Масштаб",
                content: "От Казахстана до всего тюркского мира (170+ млн человек). Единый протокол цифровой идентичности для кочевых культур.",
                stats: ["50+ Основных Родов", "170 млн Потенциальных пользователей"],
                icon: "⩚"
            },
            {
                id: "roadmap",
                title: "Дорожная Карта",
                items: [
                    "Фаза 1: MVP и оцифровка 10 ключевых родов.",
                    "Фаза 2: Интеграция с крупнейшими архивами (Tumalas, Elim).",
                    "Фаза 3: Запуск мобильного приложения и DAO-функционала."
                ],
                icon: "⩔"
            },
            {
                id: "cta",
                title: "Строим будущее",
                content: "Мы строим мост между прошлым и будущим. Тамга — это знак вашей вечности.",
                footer: "tamga.ai · nomad-gold.eth",
                icon: "⫙"
            }
        ];

        function App() {
            const [current, setCurrent] = useState(0);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === "ArrowRight") next();
                    if (e.key === "ArrowLeft") prev();
                };
                window.addEventListener("keydown", handleKeyDown);
                return () => window.removeEventListener("keydown", handleKeyDown);
            }, [current]);

            const next = () => setCurrent(c => Math.min(c + 1, slides.length - 1));
            const prev = () => setCurrent(c => Math.max(c - 1, 0));

            return (
                <main className="relative overflow-hidden w-full h-full">
                    <Background />

                    <div className="tamga-bg" style={{
                        left: '50%',
                        top: '50%',
                        transform: `translate(-50%, -50%) rotate(${current * 40}deg) scale(${1 + current * 0.05})`
                    }}>
                        {slides[current].icon}
                    </div>

                    <div className="slide-container" style={{ transform: `translateX(-${current * 100}vw)` }}>
                        {slides.map((s, i) => (
                            <div key={s.id} className="slide">
                                <div className={`glass-box w-full ${current === i ? 'animate-fade-scale' : 'opacity-0'}`}>
                                    {s.subtitle && <p className="text-[#C5A55A] tracking-[0.5em] uppercase text-[10px] font-bold mb-6 opacity-80">{s.subtitle}</p>}
                                    <h2 className={`font-serif text-5xl md:text-7xl mb-6 leading-tight ${s.id === 'cover' ? 'tracking-[0.1em] uppercase pb-2' : ''}`}>
                                        {s.title}
                                    </h2>
                                    <div className="gold-underline opacity-40"></div>

                                    {s.content && <p className="text-xl md:text-2xl text-[#ccc] leading-relaxed mb-10 font-light italic">"{s.content}"</p>}

                                    {s.image && (
                                        <div className="mb-8 rounded-3xl overflow-hidden border border-[#C5A55A30] shadow-[0_20px_50px_rgba(0,0,0,0.5)] bg-black/40">
                                            <img src={s.image} alt={s.title} className="w-full h-80 object-contain p-4" />
                                        </div>
                                    )}

                                    {s.items && (
                                        <ul className="space-y-6 text-lg md:text-xl text-[#999]">
                                            {s.items.map((item, idx) => (
                                                <li key={idx} className="flex items-start gap-5 group transition-colors hover:text-white">
                                                    <span className="text-[#C5A55A] mt-1 text-sm group-hover:scale-125 transition-transform">✦</span> {item}
                                                </li>
                                            ))}
                                        </ul>
                                    )}

                                    {s.steps && (
                                        <div className="grid md:grid-cols-3 gap-6">
                                            {s.steps.map((step, idx) => (
                                                <div key={idx} className="bg-white/5 p-8 rounded-[2rem] border border-white/5 hover:border-[#C5A55A40] transition-all hover:bg-white/[0.08] group">
                                                    <p className="text-[#C5A55A] font-bold mb-3 tracking-widest text-[10px] uppercase">{step.label}</p>
                                                    <p className="text-sm text-[#888] leading-relaxed group-hover:text-[#eee]">{step.desc}</p>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {s.tags && (
                                        <div className="flex flex-wrap gap-4 mt-8">
                                            {s.tags.map(tag => (
                                                <span key={tag} className="px-6 py-2 bg-[#C5A55A1A] border border-[#C5A55A30] rounded-full text-[10px] tracking-[0.2em] text-[#C5A55A] uppercase font-bold">
                                                    {tag}
                                                </span>
                                            ))}
                                        </div>
                                    )}

                                    {s.stats && (
                                        <div className="flex gap-16 mt-10">
                                            {s.stats.map((stat, idx) => (
                                                <div key={idx}>
                                                    <p className="text-4xl font-serif text-[#C5A55A] mb-1">{stat.split(' ')[0]}</p>
                                                    <p className="text-[10px] text-[#555] tracking-widest uppercase font-bold">{stat.split(' ').slice(1).join(' ')}</p>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {s.highlight && <p className="mt-10 inline-block px-5 py-1.5 border-l-2 border-[#C5A55A] text-[#C5A55A] font-bold tracking-[0.3em] uppercase text-[10px] bg-[#C5A55A0A]">{s.highlight}</p>}
                                    {s.footer && <p className="mt-16 text-[#444] tracking-[0.6em] uppercase text-[10px] font-bold border-t border-white/5 pt-8">{s.footer}</p>}
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="nav-dots">
                        {slides.map((_, i) => (
                            <div key={i} className={`dot cursor-pointer ${current === i ? 'active' : ''}`} onClick={() => setCurrent(i)}></div>
                        ))}
                    </div>

                    {current > 0 && (
                        <button className="nav-button left-8 md:left-12" onClick={prev}>
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" /></svg>
                        </button>
                    )}
                    {current < slides.length - 1 && (
                        <button className="nav-button right-8 md:right-12" onClick={next}>
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" /></svg>
                        </button>
                    )}
                </main>
            );
        }

        function Background() {
            return (
                <div className="fixed inset-0 pointer-events-none z-0">
                    <div className="absolute inset-0 opacity-25"
                        style={{ backgroundImage: 'radial-gradient(circle at 50% 50%, #1a1a1a 0%, transparent 85%)' }}></div>
                    <div className="absolute top-0 left-0 w-full h-full opacity-[0.03]" style={{
                        background: 'linear-gradient(rgba(197, 165, 90, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(197, 165, 90, 0.1) 1px, transparent 1px)',
                        backgroundSize: '80px 80px'
                    }}></div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
